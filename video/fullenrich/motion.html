<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Find Anyone Prompts</title>
<style>
  @font-face { font-family: IDBlack; src: url(../fonts/InterDisplay-Black.otf); }
  @font-face { font-family: IDBold;  src: url(../fonts/InterDisplay-Bold.otf); }
  @font-face { font-family: IDSemi;  src: url(../fonts/InterDisplay-SemiBold.otf); }
  @font-face { font-family: IDMed;   src: url(../fonts/InterDisplay-Medium.otf); }
  @font-face { font-family: NR;      src: url(../fonts/Newsreader-Italic.ttf); font-style: italic; }
  @font-face { font-family: JBM;     src: url(../fonts/JetBrainsMono-400.ttf); font-weight: 400; }
  @font-face { font-family: JBM;     src: url(../fonts/JetBrainsMono-600.ttf); font-weight: 600; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const CREAM = '#F0EEE6', GREY = '#9A9893', DIM = '#55544F';
const rgba = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
};
// ---------- timing (music: 128 BPM) ----------
const BEAT = 60 / 128, BAR = BEAT * 4, SLOT = BEAT * 2;
const T_DROP = BAR, T_LIST = BAR * 2, T_OUT = BAR * 7, DUR = 15;
const KICKS = [];
for (let b = 1; b < 7; b++) for (let k = 0; k < 4; k++) KICKS.push(b * BAR + k * BEAT);
KICKS.push(T_OUT, T_OUT + BEAT * 2);
const slotStart = i => T_LIST + i * SLOT;

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOutExpo = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const eInExpo = p => p <= 0 ? 0 : Math.pow(2, 10 * p - 10);
const eOutCubic = p => 1 - Math.pow(1 - p, 3);
const eInOutCubic = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eOutBack = (p, s = 1.7) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);
const eOutElastic = p => p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, -10 * p) * Math.sin((p * 10 - .75) * (2 * Math.PI) / 3) + 1;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry(42);

function pulseAt(t, decay = 7) {
  let p = 0;
  for (const k of KICKS) if (t >= k) p = Math.max(p, Math.exp(-(t - k) * decay));
  return p;
}
function font(f) { ctx.font = f; }
function txt(s, x, y, color, align = 'left', base = 'alphabetic') {
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(s, x, y);
}
function maskRise(s, x, y, p, color, size, align = 'left', dist = 1.15) {
  if (p <= 0) return;
  const w = ctx.measureText(s).width;
  const x0 = align === 'left' ? x : align === 'center' ? x - w / 2 : x - w;
  ctx.save();
  ctx.beginPath(); ctx.rect(x0 - 30, y - size * 1.0, w + 60, size * 1.28); ctx.clip();
  txt(s, x, y + (1 - p) * size * dist, color, align);
  ctx.restore();
}
function typed(s, p) { return s.slice(0, Math.round(s.length * clamp(p))); }
const SCR = '!<>-_\\/[]{}=+*^?#01';
function scramble(s, p, seed = 0) { // decode-style text reveal
  const n = s.length, out = [];
  for (let i = 0; i < n; i++) {
    const r = clamp(p * 1.6 - i / n * .6);
    if (r >= 1 || s[i] === ' ' || s[i] === '.' || s[i] === '/') out.push(s[i]);
    else if (r > 0) out.push(SCR[(i * 7 + seed + Math.floor(p * 40)) % SCR.length]);
  }
  return out.join('');
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// ---------- precomputed layers ----------
const grains = [];
for (let k = 0; k < 6; k++) {
  const g = document.createElement('canvas'); g.width = 960; g.height = 540;
  const gx = g.getContext('2d'); const im = gx.createImageData(960, 540); const r = mulberry(100 + k);
  for (let i = 0; i < im.data.length; i += 4) { im.data[i] = im.data[i + 1] = im.data[i + 2] = 255; im.data[i + 3] = r() * 10; }
  gx.putImageData(im, 0, 0); grains.push(g);
}
const dots = document.createElement('canvas'); dots.width = W; dots.height = H;
{ const d = dots.getContext('2d'); d.fillStyle = CREAM;
  for (let x = 24; x < W; x += 48) for (let y = 24; y < H; y += 48) { d.beginPath(); d.arc(x, y, 1.2, 0, 7); d.fill(); } }
const particles = Array.from({ length: 140 }, () => ({ x: rnd() * W, y: rnd() * H, v: 30 + rnd() * 120, s: .6 + rnd() * 2.4, ph: rnd() * 7, a: .2 + rnd() * .6, c: Math.floor(rnd() * 10) }));

// ---------- background ----------
function background(t, gx, gy, gr, color, ga, tint = null) {
  ctx.fillStyle = '#000'; ctx.fillRect(-60, -60, W + 120, H + 120);
  const pulse = pulseAt(t);
  const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr * (1 + pulse * .1));
  g.addColorStop(0, rgba(color, ga * (0.7 + pulse * .5)));
  g.addColorStop(.5, rgba(color, ga * .18));
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = 0.06 + pulse * 0.04; ctx.drawImage(dots, 0, 0); ctx.restore();
  // travelling light band on the dot grid
  const bandX = ((t * 520) % (W + 800)) - 400;
  ctx.save(); ctx.beginPath(); ctx.rect(bandX - 140, 0, 280, H); ctx.clip();
  ctx.globalAlpha = 0.13; ctx.drawImage(dots, 0, 0); ctx.restore();
  // drifting particles (tinted to scene brand, or rainbow)
  for (const e of particles) {
    const x = ((e.x - t * e.v) % W + W) % W;
    const y = e.y + Math.sin(t * 1.3 + e.ph) * 14;
    ctx.fillStyle = rgba(tint || RAINBOW[e.c], e.a * (0.5 + 0.5 * Math.sin(t * 5 + e.ph)) * (0.5 + pulse * .6));
    ctx.fillRect(x, y, e.s * 6, e.s * .9);
  }
}
function overlays(t, frame) {
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.72)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(grains[frame % grains.length], 0, 0, W, H);
  ctx.fillStyle = 'rgba(0,0,0,0.09)';
  for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
}
function watermark() {
  const s = 'x.com/nrqa__';
  ctx.save();
  font('500 24px IDMed');
  txt(s, 56, 62, 'rgba(242,240,234,0.40)', 'left', 'middle');
  txt(s, W - 56, H - 50, 'rgba(242,240,234,0.40)', 'right', 'middle');
  font('500 30px IDMed');
  txt(s, W / 2, H / 2, 'rgba(242,240,234,0.16)', 'center', 'middle');
  ctx.restore();
}

// ---------- Anthropic-style spark ----------
const RAY_L = [1, .74, .93, .7, .98, .79, .9, .72, 1, .77, .87, .73];
const RAY_J = RAY_L.map((_, i) => Math.sin(i * 12.9898) * 0.06);
function spark(x, y, r, p, rot, color) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = color;
  for (let i = 0; i < 12; i++) {
    const pi = clamp((p - i * 0.035) / 0.55);
    if (pi <= 0) continue;
    const len = r * RAY_L[i] * eOutBack(pi, 1.4);
    const a = i * Math.PI / 6 + RAY_J[i];
    const w0 = r * 0.075, w1 = r * 0.04;
    const ca = Math.cos(a), sa = Math.sin(a), px = -sa, py = ca;
    ctx.beginPath();
    ctx.moveTo(px * w0, py * w0);
    ctx.lineTo(ca * len + px * w1, sa * len + py * w1);
    ctx.arc(ca * len, sa * len, w1, a + Math.PI / 2, a - Math.PI / 2, true);
    ctx.lineTo(-px * w0, -py * w0);
    ctx.closePath(); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(0, 0, r * 0.11 * clamp(p * 3), 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ================= palette =================
// Claude (Anthropic) orange + cream; FullEnrich is monochrome white-on-black (from its logo).
const CO = '#D97757', CDEEP = '#C15F3C', FE = '#FFFFFF', FE2 = '#CFCFCF';
const RAINBOW = [CO, FE, FE2, CO, FE, CREAM, FE, CO, FE2, FE];

// ================= data =================
const PROMPTS = [
  { title: 'Who is missing from my open deals?',
    sub: 'Drop in your open deals. It finds the OTHER people you should be talking to.',
    prompt: 'Here are my open deals: [paste company names + current contacts]. For each company, use FullEnrich to find the other decision-makers…' },
  { title: 'Find 20 more like this customer.',
    sub: 'Give it your best customer. You get 20 similar people, ranked.',
    prompt: 'My best customer is [name, title, company, LinkedIn URL]. Analyze what makes them a great fit. Then use FullEnrich to find 20 similar people…' },
  { title: 'Fill the gaps in this CRM file.',
    sub: 'Upload an old contact list. It fills the missing details AND flags who changed jobs.',
    prompt: 'Attached is my CRM export. Use FullEnrich to fill in every missing email, phone, and job title. Flag anyone who has changed jobs…' },
  { title: 'Get contacts for this guest list.',
    sub: 'Just a screenshot of an event guest list. You get email + phone for every person.',
    prompt: "Here's a screenshot of an event guest list. Extract every name, title, and company you can read. Then use FullEnrich to find a work email…" },
  { title: 'Find companies that use [tool].',
    sub: 'Name a tool your buyers use. You get the companies ALREADY using it.',
    prompt: 'Find companies that currently use [tool name], focused on [industry / region / company size]. For each company, use FullEnrich…' },
  { title: 'Find 15 people for this job post.',
    sub: 'Paste a job opening. You get 15 candidates, sorted by best fit.',
    prompt: "Here's a job opening: [paste job post]. Pull out the must-have skills, seniority, and location. Then use FullEnrich to find 15 candidates…" },
];

// ================= timing =================
const T_STATS = BAR * 5;
const STAT_T = [0, 1, 2].map(j => T_STATS + j * BEAT * 2.75);
const ALL_T = [...PROMPTS.map((_, i) => slotStart(i)), ...STAT_T];

// ================= shared drawing =================
function wrap(s, maxW, maxLines = 3) {
  const words = s.split(' '); const lines = []; let cur = '';
  for (const w of words) { const tt = cur ? cur + ' ' + w : w; if (ctx.measureText(tt).width > maxW && cur) { lines.push(cur); cur = w; } else cur = tt; }
  if (cur) lines.push(cur); return lines.slice(0, maxLines);
}
// FullEnrich logo: ring, four-point star, two waves. Geometry measured from the brand mark,
// in units of the ring's centre-line radius r. p: build-in 0..1, t: drives star twinkle + wave flow.
function waveY(u, mid, amp, crest) { return mid - amp * Math.cos(2 * Math.PI * (u - crest) / 1.04); }
function feMark(x, y, r, p, t, color = FE) {
  if (p <= 0) return;
  const s = eOutBack(clamp(p * 1.4), 1.6);
  ctx.save(); ctx.translate(x, y); ctx.scale(s * r, s * r);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // ring draws on clockwise from the top
  const rp = eOutExpo(clamp(p * 1.5));
  ctx.lineWidth = .155;
  ctx.beginPath(); ctx.arc(0, 0, 1, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * rp); ctx.stroke();
  // star: concave four-point, pops then twinkles
  const sp = eOutBack(clamp(p * 1.8 - .45), 2.6) * (1 + .08 * Math.sin(t * 7));
  if (sp > 0) {
    ctx.save(); ctx.translate(.02, -.4); ctx.scale(sp * .33, sp * .33); ctx.rotate(Math.sin(t * 2) * .08);
    ctx.beginPath(); ctx.moveTo(0, -1);
    for (let q = 0; q < 4; q++) {
      const a1 = -Math.PI / 2 + q * Math.PI / 2, a2 = a1 + Math.PI / 2;
      ctx.quadraticCurveTo(Math.cos(a1 + Math.PI / 4) * .14, Math.sin(a1 + Math.PI / 4) * .14, Math.cos(a2), Math.sin(a2));
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  // waves: drawn left→right, clipped to the ring, flowing sideways
  const wp = eInOutCubic(clamp(p * 1.6 - .3));
  if (wp > 0) {
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, 1, 0, 7); ctx.clip();
    ctx.lineWidth = .125; ctx.lineCap = 'butt';
    const flow = t * .35;
    [[.24, .085, -.51], [.61, .085, -.45]].forEach(([mid, amp, crest], k) => {
      ctx.beginPath();
      for (let u = -1.1; u <= -1.1 + 2.2 * wp + 1e-6; u += .02) {
        const yy = waveY(u + flow * (k ? 1.3 : 1), mid, amp, crest);
        u <= -1.1 ? ctx.moveTo(u, yy) : ctx.lineTo(u, yy);
      }
      ctx.stroke();
    });
    ctx.restore();
  }
  ctx.restore();
}
function check(x, y, r, p, fill = FE, stroke = '#000') {
  if (p <= 0) return;
  ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, r * eOutBack(clamp(p), 2.4), 0, 7); ctx.fill();
  const k1 = clamp(p * 2), k2 = clamp(p * 2 - 1);
  ctx.strokeStyle = stroke; ctx.lineWidth = r * .28; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x - r * .42, y + r * .02);
  ctx.lineTo(x - r * .42 + r * .3 * k1, y + r * .02 + r * .32 * k1);
  if (k2 > 0) ctx.lineTo(x - r * .12 + r * .58 * k2, y + r * .34 - r * .66 * k2);
  ctx.stroke();
}
function person(x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y - r * .45, r * .42, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x, y + r * .75, r * .78, Math.PI, 0); ctx.fill();
}
function chip(x, y, label, color, p, size = 20, filled = true) {
  if (p <= 0) return 0;
  font(`600 ${size}px JBM`);
  const w = ctx.measureText(label).width + size * 1.2, h = size * 1.7;
  ctx.save(); ctx.globalAlpha *= clamp(p * 1.5); ctx.translate(x, y); ctx.scale(eOutBack(clamp(p), 2), eOutBack(clamp(p), 2));
  ctx.fillStyle = filled ? color : rgba(color, .14); roundRect(0, -h / 2, w, h, h / 2); ctx.fill();
  if (!filled) { ctx.strokeStyle = color; ctx.lineWidth = 1.5; roundRect(0, -h / 2, w, h, h / 2); ctx.stroke(); }
  txt(label, size * .6, 1, filled ? '#000' : color, 'left', 'middle');
  ctx.restore();
  return w;
}
// "crowd" of people-dots used in intro & outro
const CROWD = [];
{ const r = mulberry(9); for (let gx = 0; gx < 32; gx++) for (let gy = 0; gy < 18; gy++) {
  const x = 30 + gx * 60 + (r() - .5) * 26, y = 30 + gy * 60 + (r() - .5) * 26;
  CROWD.push({ x, y, a: Math.atan2(y - H / 2, x - W / 2), d: Math.hypot(x - W / 2, y - H / 2), s: .7 + r() * .6, ph: r() });
} }

// ================= SCENE A: intro =================
function sceneIntro(t) {
  background(t, W / 2, H / 2, 700, FE, 0.03 + 0.07 * prog(t, 0, 1.7), FE);
  const cx = W / 2, cy = H / 2 - 40;
  const zoom = eInExpo(prog(t, 1.35, T_DROP));
  // radar sweep over a crowd of people
  const sweepA = t * (3.2 + zoom * 10) - Math.PI / 2;
  const sp = eOutCubic(prog(t, 0, .5));
  for (const c of CROWD) {
    let da = ((sweepA - c.a) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    const hit = Math.exp(-da * 2.2);
    const found = t > .3 && c.ph < prog(t, .3, 1.6) && c.d < 300 + prog(t, 0, 1.5) * 900;
    const a = sp * (c.d < 900 * sp + 120 ? 1 : 0);
    if (a <= 0) continue;
    const col = found ? FE : CREAM;
    ctx.globalAlpha = a * (found ? .55 + hit * .45 : .12 + hit * .55);
    const zx = lerp(c.x, cx + (c.x - cx) * 3, zoom), zy = lerp(c.y, cy + (c.y - cy) * 3, zoom);
    person(zx, zy, 7 * c.s * (1 + hit * .4) * (1 + zoom * 2), col);
  }
  ctx.globalAlpha = 1;
  // sweep wedge
  ctx.save(); ctx.translate(cx, cy);
  for (let k = 0; k < 24; k++) {
    ctx.fillStyle = rgba(FE, .16 * (1 - k / 24) * sp);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 1300, sweepA - (k + 1) * .03, sweepA - k * .03); ctx.closePath(); ctx.fill();
  }
  ctx.strokeStyle = rgba(FE2, .8 * sp); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(sweepA) * 1300, Math.sin(sweepA) * 1300); ctx.stroke();
  for (let k = 1; k <= 4; k++) { ctx.strokeStyle = rgba(CREAM, .07 * sp); ctx.beginPath(); ctx.arc(0, 0, k * 170, 0, 7); ctx.stroke(); }
  ctx.restore();
  // lockup: Claude spark + FullEnrich mark
  const lx = cx - 190, rx = cx + 190;
  ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.beginPath(); ctx.ellipse(cx, cy, 420, 170, 0, 0, 7); ctx.fill();
  spark(lx, cy, 92 * (1 + zoom * 6), prog(t, .08, .7), t * 1.4, CO);
  feMark(rx, cy, 78 * (1 + zoom * 6), prog(t, .25, .8), t);
  const pl = eOutBack(prog(t, .45, .75), 2.4);
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * 2); ctx.scale(pl, pl);
  ctx.fillStyle = CREAM; ctx.fillRect(-26, -5, 52, 10); ctx.fillRect(-5, -26, 10, 52); ctx.restore();
  ctx.globalAlpha = 1 - zoom;
  font('800 40px IDBold');
  maskRise('Claude', lx, cy + 160, eOutExpo(prog(t, .45, .85)), CO, 40, 'center');
  maskRise('FullEnrich', rx, cy + 160, eOutExpo(prog(t, .55, .95)), FE2, 40, 'center');
  font('400 30px JBM');
  const line = typed('> find anyone. email + phone. verified.', prog(t, .55, 1.4));
  txt(line + (Math.floor(t * 4) % 2 ? '_' : ' '), cx, cy + 300, CREAM, 'center');
  ctx.globalAlpha = 1;
  if (zoom > 0) { ctx.fillStyle = rgba(FE, zoom * .95); ctx.fillRect(-60, -60, W + 120, H + 120); }
}

// ================= SCENE B: hero =================
function sceneHero(t) {
  const lt = t - T_DROP;
  background(t, 1450, 520, 760, CO, 0.2, FE);
  const out = i => eInExpo(prog(t, T_LIST - .45 + i * .04, T_LIST - .1 + i * .04));
  const X = 130;
  const L = [T_DROP, T_DROP + BEAT, T_DROP + BEAT * 2, T_DROP + BEAT * 3];
  // "6 PROMPTS" — the 6 slams with echo rings
  ctx.save(); ctx.translate(-out(0) * 1500, 0);
  const sp = prog(t, L[0], L[0] + .3);
  font('900 300px IDBlack');
  const sc = lerp(2.2, 1, eOutBack(sp, 1.4));
  ctx.save(); ctx.translate(X + 90, 330); ctx.scale(sc, sc);
  for (const kk of KICKS) {
    const age = (t - kk) / .5; if (kk < T_DROP + .2 || age < 0 || age > 1) continue;
    ctx.save(); ctx.scale(1 + age * .3, 1 + age * .3); ctx.strokeStyle = rgba(CO, .5 * (1 - age)); ctx.lineWidth = 3;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.strokeText('6', 0, 10); ctx.restore();
  }
  txt('6', 0, 10, CO, 'center', 'middle');
  ctx.restore();
  font('900 150px IDBlack');
  maskRise('PROMPTS', X + 230, 390, eOutExpo(prog(t, L[0] + .05, L[0] + .35)), CREAM, 150);
  ctx.restore();
  ctx.save(); ctx.translate(-out(1) * 1500, 0);
  font('900 150px IDBlack');
  maskRise('TO FIND', X, 570, eOutExpo(prog(t, L[1] - .03, L[1] + .3)), CREAM, 150);
  ctx.restore();
  // ANYONE in a white block
  ctx.save(); ctx.translate(-out(2) * 1500, 0);
  font('900 150px IDBlack');
  const aw = ctx.measureText('ANYONE').width;
  const bp = eOutExpo(prog(t, L[2] - .03, L[2] + .3));
  ctx.fillStyle = FE; ctx.fillRect(X - 20, 610, (aw + 44) * bp, 160);
  ctx.fillStyle = CO; ctx.fillRect(X - 20, 770, (aw + 44) * bp, 10);
  ctx.beginPath(); ctx.rect(X - 20, 610, (aw + 44) * bp, 160); ctx.clip();
  txt('ANYONE', X + (1 - bp) * -90, 748, '#000');
  ctx.restore();
  // with Claude + FullEnrich
  ctx.save(); ctx.translate(-out(3) * 1500, 0);
  const wp = eOutExpo(prog(t, L[3] - .05, L[3] + .3));
  font('italic 400 60px NR'); maskRise('with', X, 880, wp, GREY, 60);
  spark(X + 165, 860, 26, prog(t, L[3], L[3] + .35), t * 2, CO);
  font('800 52px IDBold'); maskRise('Claude', X + 205, 880, wp, CO, 52);
  const cw = ctx.measureText('Claude ').width;
  maskRise('+', X + 215 + cw, 880, wp, CREAM, 52);
  feMark(X + 290 + cw, 862, 24, prog(t, L[3] + .05, L[3] + .4), t);
  maskRise('FullEnrich', X + 330 + cw, 880, eOutExpo(prog(t, L[3], L[3] + .35)), FE2, 52);
  ctx.restore();

  // right: a contact card getting enriched field by field

// ================= transitions =================
function slab(t, t0, dur, colors, dir = 1) {
  const p = prog(t, t0, t0 + dur);
  if (p <= 0 || p >= 1) return;
  const e = eInOutCubic(p);
  const skew = 300, totalW = W + 2 * skew + 600, n = colors.length;
  for (let i = 0; i < n; i++) {
    const lag = i * .06;
    const ee = clamp((e - lag) / (1 - lag * (n - 1) / n));
    const x = lerp(-totalW, W + skew, dir > 0 ? ee : 1 - ee);
    const w = i === n - 1 ? W + 400 : 70 + i * 40;
    ctx.fillStyle = colors[i];
    ctx.beginPath(); ctx.moveTo(x + skew, 0); ctx.lineTo(x + skew + w, 0); ctx.lineTo(x + w, H); ctx.lineTo(x, H); ctx.closePath(); ctx.fill();
  }
}
function barsWipe(t, t0, color, dir) {
  const d = .22, p = prog(t, t0 - d / 2, t0 + d / 2);
  if (p <= 0 || p >= 1) return;
  const n = 9, bh = H / n;
  for (let i = 0; i < n; i++) {
    const q = clamp(p * 1.6 - (dir > 0 ? i : n - 1 - i) * .07);
    const a = eInOutCubic(clamp(q * 2)), b = eInOutCubic(clamp(q * 2 - 1));
    const x0 = dir > 0 ? b * W : (1 - a) * W, x1 = dir > 0 ? a * W : (1 - b) * W;
    ctx.fillStyle = i % 3 === 1 ? CREAM : i % 3 === 2 ? CO : color;
    ctx.fillRect(Math.min(x0, x1), i * bh, Math.abs(x1 - x0), bh + 1);
  }
}

    font('900 130px IDBlack');
    maskRise('<1%', LX - 4, 760, eOutExpo(prog(lt, .35, .6)), CO, 130);
    font('500 40px IDMed'); maskRise('of emails bounce', LX + 290, 745, eOutExpo(prog(lt, .4, .65)), CREAM, 40);
  } else if (j === 1) {
    // waffle of 1,000 people: 530 vs 910
    const cols = 40, rows = 25, sz = 13, g = 4, WX = 1060, WY = 270;
    const a = Math.round(530 * eOutCubic(prog(lt, .05, .45)));
    const b = Math.round(910 * eOutCubic(prog(lt, .4, .85)));
    for (let q = 0; q < 1000; q++) {
      const c = Math.floor(q / rows), r = q % rows;
      ctx.fillStyle = q < a ? DIM : q < b ? FE : rgba(CREAM, .06);
      if (q >= a && q < b && q > b - 40) ctx.fillStyle = CO;
      ctx.fillRect(WX + c * (sz + g) * 1.0, WY + r * (sz + g), sz, sz);
    }
    font('600 18px JBM'); txt('1,000 people · same list', WX, WY - 22, GREY);
    const bars = [['One data source', 530, DIM, a], ['FullEnrich', 910, FE, b]];
    bars.forEach(([lab, v, col, cur], q) => {
      const y = 330 + q * 170;
      font('700 34px IDBold'); maskRise(lab, LX, y, eOutExpo(prog(lt, q * .3, q * .3 + .3)), q ? FE2 : CREAM, 34);
      ctx.fillStyle = rgba(CREAM, .08); roundRect(LX, y + 24, 760, 50, 12); ctx.fill();
      ctx.fillStyle = col; roundRect(LX, y + 24, Math.max(1, 760 * cur / 1000), 50, 12); ctx.fill();
      font('900 44px IDBlack'); txt(String(cur), LX + 760 * cur / 1000 + 16, y + 64, q ? FE2 : CREAM);
    });
    const mp = prog(lt, .85, 1.05);
    if (mp > 0) {
      ctx.save(); ctx.translate(LX + 330, 760); ctx.rotate(-.06); const s = lerp(2.2, 1, eOutBack(mp, 1.6)); ctx.scale(s, s);
      font('900 96px IDBlack'); const w = ctx.measureText('+380 MORE').width;
      ctx.fillStyle = CO; ctx.fillRect(-w / 2 - 24, -78, w + 48, 104);
      txt('+380 MORE', 0, 0, '#000', 'center'); ctx.restore();
      font('500 30px IDMed'); ctx.globalAlpha = mp; txt('people found. same list.', LX, 880, CREAM); ctx.globalAlpha = 1;
    }
  } else {
    // credits: 1 · 10 · 0
    const items = [['EMAIL', '1', 'credit', FE], ['PHONE', '10', 'credits', CO], ['NOTHING FOUND', '0', 'charged', GREY]];
    items.forEach(([lab, n, unit, col], q) => {
      const x = 130 + q * 570, y = 300;
      const pp = prog(lt, q * BEAT * .55, q * BEAT * .55 + .35);
      if (pp <= 0) return;
      const s = eOutBack(pp, 1.6);
      ctx.save(); ctx.translate(x + 260, y + 260); ctx.scale(s, s); ctx.rotate((1 - clamp(pp)) * .3);
      ctx.fillStyle = q === 2 ? 'rgba(25,24,22,.95)' : rgba(col, .14); roundRect(-260, -260, 520, 480, 34); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 3; roundRect(-260, -260, 520, 480, 34); ctx.stroke();
      font('600 26px JBM'); txt(lab, -220, -200, col);
      // coin
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 10, 120 * (1 + (q === Math.floor(lt * 4) % 3 ? .03 : 0)), 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, 10, 100, 0, 7); ctx.stroke();
      font('900 110px IDBlack'); txt(n, 0, 14, '#000', 'center', 'middle');
      if (q === 2) { ctx.strokeStyle = CO; ctx.lineWidth = 10; ctx.lineCap = 'round'; const sp = eOutExpo(prog(pp, .4, 1)); ctx.beginPath(); ctx.moveTo(-110, 120); ctx.lineTo(-110 + 220 * sp, 120 - 220 * sp); ctx.stroke(); }
      font('800 44px IDBold'); txt(`= ${n} ${unit}`, 0, 190, CREAM, 'center');
      ctx.restore();
    });
    font('500 34px IDMed');
    ctx.globalAlpha = eOutCubic(prog(lt, .7, 1));
    txt('Nothing found = nothing charged.', W / 2, 900, CREAM, 'center');
    ctx.globalAlpha = 1;
  }
  railAndKicker(t, 6 + j);
}

// ================= SCENE E: outro =================
function sceneOutro(t) {
  const lt = t - T_OUT;
  background(t, W / 2, H / 2, 900, CO, .18, FE);
  // the whole crowd, found — radiating from centre
  for (const c of CROWD) {
    const d = c.d / 1100, fp = prog(lt, d * .5, d * .5 + .2);
    if (fp <= 0) continue;
    ctx.globalAlpha = .18 + .25 * Math.exp(-((lt * 1.2 - d) % 1 + 1) % 1 * 4);
    person(c.x, c.y, 7 * c.s * eOutBack(fp, 2), c.ph < .12 ? CO : FE);
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.beginPath(); ctx.ellipse(W / 2, 520, 820, 330, 0, 0, 7); ctx.fill();
  const fl = Math.exp(-lt * 9);
  if (fl > .01) { ctx.fillStyle = rgba(FE2, .6 * fl); ctx.fillRect(0, 0, W, H); }

  // lockup
  const cy = 330;
  spark(W / 2 - 120, cy, 62, prog(lt, .05, .5), lt * 1.5, CO);
  const pl = eOutBack(prog(lt, .15, .4), 2.4);
  ctx.save(); ctx.translate(W / 2, cy); ctx.scale(pl, pl); ctx.fillStyle = CREAM; ctx.fillRect(-20, -4, 40, 8); ctx.fillRect(-4, -20, 8, 40); ctx.restore();
  feMark(W / 2 + 120, cy, 54, prog(lt, .12, .5), t);
  // headline
  font('900 150px IDBlack');
  const h1 = 'Find ', h2 = 'anyone.';
  const w1 = ctx.measureText(h1).width, w2 = ctx.measureText(h2).width;
  const hx = W / 2 - (w1 + w2) / 2, hy = 600;
  maskRise(h1, hx, hy, eOutExpo(prog(lt, .2, .55)), CREAM, 150);
  const g = ctx.createLinearGradient(hx + w1, 0, hx + w1 + w2, 0);
  const sh = (lt * .6) % 1;
  g.addColorStop(0, FE); g.addColorStop(clamp(sh), FE2); g.addColorStop(1, CO);
  maskRise(h2, hx + w1, hy, eOutExpo(prog(lt, .3, .65)), g, 150);
  ctx.fillStyle = CO; ctx.fillRect(hx + w1, hy + 24, w2 * eOutExpo(prog(lt, .5, .9)), 8);
  font('600 34px JBM');
  ctx.globalAlpha = eOutCubic(prog(lt, .55, .85));
  txt('Claude + FullEnrich', W / 2, 700, CREAM, 'center');
  font('500 28px IDMed');
  txt('verified email + phone  ·  20+ data sources  ·  pay only when found', W / 2, 760, GREY, 'center');
  ctx.globalAlpha = 1;
  chip(W / 2 - 150, 850, 'SAVE THESE PROMPTS ↗', FE, prog(lt, .8, 1.1), 24);
}

// ================= master render =================
window.render = function (t, frame = 0) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  let sx = 0, sy = 0;
  for (const it of [T_DROP, T_OUT]) if (t >= it) { const a = 18 * Math.exp(-(t - it) * 7); sx += Math.sin(t * 91) * a; sy += Math.cos(t * 77) * a; }
  for (const it of ALL_T) if (t >= it) { const a = 6 * Math.exp(-(t - it) * 12); sx += Math.sin(t * 113) * a; sy += Math.cos(t * 97) * a; }
  const z = 1 + pulseAt(t, 9) * .01;
  ctx.setTransform(z, 0, 0, z, W / 2 * (1 - z) + sx, H / 2 * (1 - z) + sy);

  if (t < T_DROP) sceneIntro(t);
  else if (t < T_LIST) sceneHero(t);
  else if (t < T_STATS) scenePrompt(t);
  else if (t < T_OUT) sceneStat(t);
  else sceneOutro(t);

  if (t >= T_DROP && t < T_DROP + .3) { ctx.fillStyle = `rgba(255,255,255,${.7 * Math.exp(-(t - T_DROP) * 14)})`; ctx.fillRect(-60, -60, W + 120, H + 120); }
  slab(t, T_LIST - .38, .7, [FE2, CREAM, CO, FE, CO]);
  for (let i = 1; i < 6; i++) barsWipe(t, slotStart(i), i % 2 ? FE : CO, i % 2 ? 1 : -1);
  slab(t, T_STATS - .3, .6, [CO, CREAM, FE2, FE], -1);
  for (let j = 1; j < 3; j++) barsWipe(t, STAT_T[j], FE, j % 2 ? 1 : -1);
  slab(t, T_OUT - .32, .6, [CO, FE2, CREAM, FE]);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  overlays(t, frame);
  watermark();
};

window.ready = (async () => {
  const fams = ['900 50px IDBlack', '800 50px IDBold', '500 50px IDMed', 'italic 400 50px NR', '400 50px JBM', '600 50px JBM'];
  await Promise.all(fams.map(f => document.fonts.load(f)));
  await document.fonts.ready;
  return true;
})();
if (!navigator.webdriver) {
  (async () => { await window.ready; const t0 = performance.now(); const loop = () => { const t = ((performance.now() - t0) / 1000) % DUR; render(t, Math.floor(t * 60)); requestAnimationFrame(loop); }; loop(); })();
}
</script>
