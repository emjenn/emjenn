<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>System Design Repos</title>
<style>
  @font-face { font-family: Mona; src: url(../fonts/MonaSans-500.woff2); font-weight: 500; }
  @font-face { font-family: Mona; src: url(../fonts/MonaSans-600.woff2); font-weight: 600; }
  @font-face { font-family: Mona; src: url(../fonts/MonaSans-700.woff2); font-weight: 700; }
  @font-face { font-family: Mona; src: url(../fonts/MonaSans-800.woff2); font-weight: 800; }
  @font-face { font-family: Mona; src: url(../fonts/MonaSans-900.woff2); font-weight: 900; }
  @font-face { font-family: Mona; src: url(../fonts/MonaSans-800i.woff2); font-weight: 800; font-style: italic; }
  @font-face { font-family: Hubot; src: url(../fonts/HubotSans-800.woff2); font-weight: 800; }
  @font-face { font-family: Hubot; src: url(../fonts/HubotSans-900.woff2); font-weight: 900; }
  @font-face { font-family: Neon; src: url(../fonts/MonaspaceNeon-400.woff2); font-weight: 400; }
  @font-face { font-family: Neon; src: url(../fonts/MonaspaceNeon-600.woff2); font-weight: 600; }
  @font-face { font-family: Neon; src: url(../fonts/MonaspaceNeon-700.woff2); font-weight: 700; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const layer = mk(), lctx = layer.getContext('2d');

// ---------- palette (GitHub Primer, dark) ----------
const C = {
  bg: '#000000', canvas: '#0D1117', surface: '#161B22', btn: '#21262D', border: '#30363D', faint: '#484F58',
  fg: '#F0F6FC', text: '#C9D1D9', muted: '#8B949E',
  green: '#3FB950', green2: '#2EA043', greenBtn: '#238636', blue: '#58A6FF', purple: '#A371F7',
  orange: '#F0883E', pink: '#DB61A2', yellow: '#E3B341', red: '#F85149',
  g0: '#161B22', g1: '#0E4429', g2: '#006D32', g3: '#26A641', g4: '#39D353',
};
const GREENS = [C.g0, C.g1, C.g2, C.g3, C.g4];
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

// ---------- timing (music: 128 BPM, 8 bars = 15s) ----------
const BEAT = 60 / 128, BAR = BEAT * 4, DUR = 15;
const T_DROP = BAR, T_REPO = BAR * 2, T_OUT = BAR * 7, SLOT = BEAT * 2;
const KICKS = [];
for (let b = 1; b < 7; b++) for (const k of [0, 1.5, 2.5]) KICKS.push(b * BAR + k * BEAT);  // broken-beat kick pattern
KICKS.push(T_OUT, T_OUT + BEAT * 2);

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOutExpo = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const eInExpo = p => p <= 0 ? 0 : Math.pow(2, 10 * p - 10);
const eOutCubic = p => 1 - Math.pow(1 - p, 3);
const eInCubic = p => p * p * p;
const eInOutCubic = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eOutBack = (p, s = 1.7) => p <= 0 ? 0 : 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry(1010);
function pulseAt(t, decay = 7) { let p = 0; for (const k of KICKS) if (t >= k) p = Math.max(p, Math.exp(-(t - k) * decay)); return p; }
function font(f, c = ctx) { c.font = f; }
function txt(s, x, y, color, align = 'left', base = 'alphabetic', c = ctx) { c.fillStyle = color; c.textAlign = align; c.textBaseline = base; c.fillText(s, x, y); }
function fit(s, weight, fam, max, maxW) { ctx.font = `${weight} ${max}px ${fam}`; const w = ctx.measureText(s).width; return w > maxW ? Math.floor(max * maxW / w) : max; }
function typed(s, p) { return s.slice(0, Math.round(s.length * clamp(p))); }
function wrap(s, maxW) {
  const words = s.split(' '), lines = []; let cur = '';
  for (const w of words) { const tt = cur ? cur + ' ' + w : w; if (ctx.measureText(tt).width > maxW && cur) { lines.push(cur); cur = w; } else cur = tt; }
  if (cur) lines.push(cur); return lines;
}
function rrect(x, y, w, h, r, c = ctx) { c.beginPath(); c.roundRect(x, y, w, h, r); }
// text rising out of a clip mask, per-character stagger (keeps kerning via prefix measuring)
function riseChars(s, x, y, size, t0, t, color, stagger = .018, dur = .32, align = 'left') {
  const w = ctx.measureText(s).width;
  const x0 = align === 'left' ? x : align === 'center' ? x - w / 2 : x - w;
  ctx.save(); ctx.beginPath(); ctx.rect(x0 - 30, y - size * 1.05, w + 60, size * 1.4); ctx.clip();
  ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  for (let i = 0; i < s.length; i++) {
    const p = eOutExpo(prog(t, t0 + i * stagger, t0 + i * stagger + dur));
    if (p <= 0) continue;
    const cx = x0 + ctx.measureText(s.slice(0, i)).width;
    ctx.fillText(s[i], cx, y + (1 - p) * size * 1.1);
  }
  ctx.restore();
}
function maskRise(s, x, y, p, color, size, align = 'left') {
  if (p <= 0) return;
  const w = ctx.measureText(s).width;
  const x0 = align === 'left' ? x : align === 'center' ? x - w / 2 : x - w;
  ctx.save(); ctx.beginPath(); ctx.rect(x0 - 20, y - size * 1.05, w + 40, size * 1.4); ctx.clip();
  txt(s, x, y + (1 - p) * size * 1.15, color, align); ctx.restore();
}
function hash7(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16).padStart(8, '0').slice(0, 7); }

// ---------- icons (drawn, Octicon-style) ----------
function iconRepo(x, y, s, color) { // book
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 16, s / 16);
  ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(3, 13); ctx.lineTo(3, 3); ctx.quadraticCurveTo(3, 1.5, 4.5, 1.5); ctx.lineTo(13, 1.5); ctx.lineTo(13, 11.5); ctx.lineTo(4.5, 11.5);
  ctx.quadraticCurveTo(3, 11.5, 3, 13); ctx.quadraticCurveTo(3, 14.5, 4.5, 14.5); ctx.lineTo(6, 14.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(7, 13); ctx.lineTo(7, 16); ctx.lineTo(8.25, 15); ctx.lineTo(9.5, 16); ctx.lineTo(9.5, 13); ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  ctx.restore();
}
function starPath(cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
  ctx.closePath();
}
function iconFork(x, y, s, color) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 16, s / 16); ctx.strokeStyle = color; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  for (const [a, b] of [[4, 3], [12, 3], [8, 13]]) { ctx.beginPath(); ctx.arc(a, b, 1.8, 0, 7); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(4, 5); ctx.lineTo(4, 6.5); ctx.quadraticCurveTo(4, 8, 6, 8); ctx.lineTo(10, 8); ctx.quadraticCurveTo(12, 8, 12, 6.5); ctx.lineTo(12, 5);
  ctx.moveTo(8, 8); ctx.lineTo(8, 11); ctx.stroke(); ctx.restore();
}
function cursor(x, y, press = 0, a = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.translate(x, y); const s = 1.5 * (1 - press * .18); ctx.scale(s, s); ctx.globalAlpha *= a;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 23); ctx.lineTo(6, 17.5); ctx.lineTo(10, 26); ctx.lineTo(13.5, 24.5); ctx.lineTo(9.5, 16.5); ctx.lineTo(17, 16.5); ctx.closePath();
  ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1.6; ctx.lineJoin = 'round'; ctx.stroke(); ctx.restore();
}

const grains = []; for (let g = 0; g < 6; g++) { const c = mk(W / 2, H / 2), d = c.getContext('2d'), im = d.createImageData(W / 2, H / 2);
  for (let i = 0; i < im.data.length; i += 4) { const v = rnd() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 13; } d.putImageData(im, 0, 0); grains.push(c); }
// ---------- data ----------
const ACC = [C.green, C.blue, C.purple, C.orange, C.pink, C.yellow, C.green, C.blue, C.purple, C.orange];
const REPOS = [
  ['System Design Primer', 'donnemartin', 'system-design-primer', 'gateway', 'API GATEWAY',
    'The classic. Learn how to design large-scale systems and prep for the interview.', ['Fundamentals', 'Interview prep', 'Flashcards']],
  ['System Design 101', 'ByteByteGoHq', 'system-design-101', 'cdn', 'CDN',
    'Complex systems explained with visuals and simple terms.', ['Visual', 'Diagrams', 'Beginner-friendly']],
  ['System Design by Karan Pratap Singh', 'karanpratapsingh', 'system-design', 'lb', 'LOAD BALANCER',
    'A free course from networking basics to designing WhatsApp, Netflix and Uber.', ['Full course', 'Case studies']],
  ['Awesome System Design Resources', 'ashishps1', 'awesome-system-design-resources', 'server', 'API SERVER',
    'Free resources to learn system design concepts and prep for interviews.', ['Curated', 'Concepts', 'Interview prep']],
  ['Awesome Scalability', 'binhnguyennus', 'awesome-scalability', 'cache', 'CACHE',
    'Patterns of scalable, reliable and performant large-scale systems, from real engineering blogs.', ['Scalability', 'Reliability', 'Real-world']],
  ['Awesome System Design', 'madd86', 'awesome-system-design', 'queue', 'MESSAGE QUEUE',
    'A curated list of distributed systems resources.', ['Distributed systems', 'Curated']],
  ['System Design Interview', 'checkcheckzz', 'system-design-interview', 'db', 'DATABASE',
    'Interview prep, plus links to how real companies built their systems.', ['Interview', 'Company case studies']],
  ['Machine Learning Systems Design', 'chiphuyen', 'machine-learning-systems-design', 'ml', 'ML SERVICE',
    "Chip Huyen's booklet on designing ML systems, with case studies and practice questions.", ['ML', 'Production', 'Practice']],
  ['System Design Academy', 'systemdesign42', 'system-design-academy', 'replica', 'READ REPLICA',
    'A structured path to learn system design, step by step.', ['Learning path', 'Step by step']],
  ['Agentic Design Patterns', 'sarwarbeing-ai', 'Agentic_Design_Patterns', 'agent', 'AGENT ORCHESTRATOR',
    'Design patterns for building AI agent systems.', ['AI agents', 'Patterns', 'New wave']],
].map(([name, owner, repo, kind, type, desc, tags], i) => ({ name, owner, repo, kind, type, desc, tags, acc: ACC[i] }));

// ---------- component icons (architecture-diagram glyphs) ----------
function icon(kind, x, y, s, color) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 24, s / 24);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const cyl = (cx, cy, w, h) => {
    ctx.beginPath(); ctx.ellipse(cx, cy - h / 2, w / 2, 3, 0, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - w / 2, cy - h / 2); ctx.lineTo(cx - w / 2, cy + h / 2); ctx.ellipse(cx, cy + h / 2, w / 2, 3, 0, Math.PI, 0, true); ctx.lineTo(cx + w / 2, cy - h / 2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, cy, w / 2, 3, 0, 0, Math.PI); ctx.stroke();
  };
  ctx.beginPath();
  switch (kind) {
    case 'client': ctx.strokeRect(3, 4, 18, 12); ctx.moveTo(8, 20); ctx.lineTo(16, 20); ctx.moveTo(12, 16); ctx.lineTo(12, 20); ctx.stroke(); break;
    case 'gateway': ctx.moveTo(2, 12); ctx.lineTo(9, 12); ctx.moveTo(6, 8); ctx.lineTo(10, 12); ctx.lineTo(6, 16); ctx.moveTo(12, 3); ctx.lineTo(21, 3); ctx.lineTo(21, 21); ctx.lineTo(12, 21); ctx.stroke(); break;
    case 'cdn': ctx.arc(12, 12, 9, 0, 7); ctx.moveTo(3, 12); ctx.lineTo(21, 12); ctx.stroke(); ctx.beginPath(); ctx.ellipse(12, 12, 4, 9, 0, 0, 7); ctx.stroke(); break;
    case 'lb': ctx.arc(5, 12, 2.5, 0, 7); ctx.moveTo(7.5, 12); ctx.lineTo(19, 5); ctx.moveTo(7.5, 12); ctx.lineTo(19, 12); ctx.moveTo(7.5, 12); ctx.lineTo(19, 19); ctx.stroke(); break;
    case 'server': for (const yy of [3, 10, 17]) { ctx.rect(3, yy, 18, 5); } ctx.stroke(); for (const yy of [5.5, 12.5, 19.5]) { ctx.beginPath(); ctx.arc(17, yy, 1, 0, 7); ctx.fill(); } break;
    case 'cache': ctx.moveTo(13, 2); ctx.lineTo(5, 14); ctx.lineTo(12, 14); ctx.lineTo(11, 22); ctx.lineTo(19, 10); ctx.lineTo(12, 10); ctx.closePath(); ctx.stroke(); break;
    case 'queue': for (let k = 0; k < 4; k++) ctx.rect(2 + k * 5.5, 7, 4, 10); ctx.stroke(); break;
    case 'db': cyl(12, 12, 16, 14); break;
    case 'replica': cyl(9, 10, 12, 10); cyl(15, 15, 12, 10); break;
    case 'ml': { const P = [[4, 6], [4, 18], [12, 4], [12, 12], [12, 20], [20, 12]]; for (const [a, b] of [[0, 2], [0, 3], [1, 3], [1, 4], [2, 5], [3, 5], [4, 5]]) { ctx.moveTo(...P[a]); ctx.lineTo(...P[b]); } ctx.stroke(); for (const p of P) { ctx.beginPath(); ctx.arc(p[0], p[1], 2, 0, 7); ctx.fill(); } break; }
    case 'agent': for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2 - Math.PI / 2; ctx.lineTo(12 + Math.cos(a) * 10, 12 + Math.sin(a) * 10); } ctx.closePath(); ctx.stroke(); ctx.beginPath(); ctx.arc(9, 11, 1.4, 0, 7); ctx.arc(15, 11, 1.4, 0, 7); ctx.fill(); ctx.beginPath(); ctx.moveTo(9, 15); ctx.lineTo(15, 15); ctx.stroke(); break;
  }
  ctx.restore();
}
function bez(p0, p1, p2, p3, u) {
  const v = 1 - u;
  return [v * v * v * p0[0] + 3 * v * v * u * p1[0] + 3 * v * u * u * p2[0] + u * u * u * p3[0],
    v * v * v * p0[1] + 3 * v * v * u * p1[1] + 3 * v * u * u * p2[1] + u * u * u * p3[1]];
}
function strokeBez(P, from, to, n = 40) {
  ctx.beginPath();
  for (let k = 0; k <= n; k++) { const [x, y] = bez(...P, lerp(from, to, k / n)); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke();
}
function packet(P, u, color, s = 9) {
  const [x, y] = bez(...P, clamp(u));
  ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = 18; ctx.fillStyle = color; rrect(x - s / 2, y - s / 2, s, s, 2); ctx.fill(); ctx.restore();
}
// fit a title on one line, or balance it over two
function nameLayout(name, weight, fam, max, maxW, minOne) {
  const one = fit(name, weight, fam, max, maxW);
  if (one >= minOne) return { lines: [name], size: one };
  const w = name.split(' '); let best = null;
  for (let k = 1; k < w.length; k++) {
    const a = w.slice(0, k).join(' '), b = w.slice(k).join(' ');
    ctx.font = `${weight} 100px ${fam}`; const m = Math.max(ctx.measureText(a).width, ctx.measureText(b).width);
    if (!best || m < best.m) best = { m, lines: [a, b] };
  }
  return { lines: best.lines, size: Math.min(max * .86, Math.floor(100 * maxW / best.m)) };
}

// ---------- background: blueprint grid ----------
function background(t, cam, gx, gy, gr, acc, ga) {
  ctx.fillStyle = '#000'; ctx.fillRect(-60, -60, W + 120, H + 120);
  const pulse = pulseAt(t);
  const blobs = [[gx, gy, gr * (1 + pulse * .07), acc, ga * (.8 + pulse * .4)],
    [W * .85 + Math.sin(t * .7) * 120, H * .15 + Math.cos(t * .5) * 80, 640, C.blue, ga * .4],
    [W * .1 + Math.cos(t * .6) * 100, H * .92, 560, C.purple, ga * .32]];
  for (const [x, y, r, c, a] of blobs) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgba(c, a)); g.addColorStop(.5, rgba(c, a * .25)); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  const { x: cx, y: cy, z } = cam;
  for (const [step, a, lw] of [[80, .05, 1], [400, .11, 1.2]]) {
    const s = step * z; if (s < 14) continue;
    const ox = ((W / 2 - cx * z) % s + s) % s, oy = ((H / 2 - cy * z) % s + s) % s;
    ctx.fillStyle = rgba(C.blue, a + pulse * .03);
    for (let x = ox; x < W; x += s) ctx.fillRect(x, 0, lw, H);
    for (let y = oy; y < H; y += s) ctx.fillRect(0, y, W, lw);
    if (step === 400) { ctx.fillStyle = rgba(C.blue, .35); for (let x = ox; x < W; x += s) for (let y = oy; y < H; y += s) { ctx.fillRect(x - 5, y, 11, 1.5); ctx.fillRect(x, y - 5, 1.5, 11); } }
  }
}
function overlays(t, frame) {
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * 1.1);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.62)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(grains[frame % grains.length], 0, 0, W, H);
  ctx.fillStyle = 'rgba(0,0,0,0.07)'; for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
}
function watermark() {
  const s = 'x.com/nrqa__';
  ctx.save();
  font('600 24px Neon');
  txt(s, 56, 62, 'rgba(240,246,252,0.42)', 'left', 'middle');
  txt(s, W - 56, H - 54, 'rgba(240,246,252,0.42)', 'right', 'middle');
  font('600 30px Neon');
  txt(s, W / 2, H / 2, 'rgba(240,246,252,0.15)', 'center', 'middle');
  ctx.restore();
}
function sliceGlitch(amount, seed) {
  if (amount <= .02) return;
  const r = mulberry(seed);
  for (let k = 0; k < 7; k++) {
    const y = Math.floor(r() * H), h = Math.floor(10 + r() * 70), dx = (r() - .5) * 2 * 80 * amount;
    ctx.drawImage(cv, 0, y, W, h, dx, y, W, h);
  }
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .3 * amount; ctx.drawImage(cv, 10 * amount, 0); ctx.restore();
}
const SCREEN = { x: W / 2, y: H / 2, z: 1 };

// ================= SCENE A: a live architecture diagram builds itself =================
const IN_NODES = [
  ['client', 'Client', 230, 560], ['cdn', 'CDN', 600, 300], ['lb', 'Load Balancer', 600, 560],
  ['server', 'API · 1', 960, 360], ['server', 'API · 2', 960, 560], ['server', 'API · 3', 960, 760],
  ['cache', 'Cache', 1330, 400], ['db', 'Primary DB', 1330, 720], ['replica', 'Replica', 1690, 720], ['queue', 'Queue', 1690, 400],
];
const IN_EDGES = [[0, 1], [0, 2], [2, 3], [2, 4], [2, 5], [3, 6], [4, 6], [4, 7], [5, 7], [7, 8], [6, 9]];
const IN_COL = [C.muted, C.purple, C.green, C.blue, C.blue, C.blue, C.pink, C.yellow, C.yellow, C.orange];
function edgeP(a, b) {
  const [, , x0, y0] = IN_NODES[a], [, , x1, y1] = IN_NODES[b];
  const sx = x0 + 110, ex = x1 - 110, mx = (sx + ex) / 2;
  return [[sx, y0], [mx, y0], [mx, y1], [ex, y1]];
}
function sceneIntro(t) {
  background(t, SCREEN, W / 2, 560, 800, C.blue, .06 + .1 * prog(t, .3, 1.5));
  const col = eInExpo(prog(t, 1.4, T_DROP));
  ctx.save(); ctx.translate(W / 2, 560); ctx.scale(1 - col * .85, 1 - col * .85); ctx.rotate(col * .25); ctx.translate(-W / 2, -560);
  // prompt
  font('600 32px Neon');
  const cmd = 'design --users=10M --budget=$0';
  const fw = ctx.measureText('$ ' + cmd).width, tx = W / 2 - fw / 2, tp = prog(t, .02, .5);
  txt('$', tx, 150, C.green); const sh = typed(cmd, tp); txt(sh, tx + ctx.measureText('$ ').width, 150, C.fg);
  if (tp < 1 || Math.floor(t * 5) % 2) { ctx.fillStyle = C.green; ctx.fillRect(tx + ctx.measureText('$ ' + sh).width + 4, 124, 17, 32); }
  // edges
  IN_EDGES.forEach(([a, b], k) => {
    const P = edgeP(a, b), d0 = .45 + k * .035, p = eInOutCubic(prog(t, d0, d0 + .3));
    if (p <= 0) return;
    ctx.strokeStyle = C.border; ctx.lineWidth = 2.5; strokeBez(P, 0, p);
    ctx.setLineDash([6, 10]); ctx.lineDashOffset = -t * 60; ctx.strokeStyle = rgba(IN_COL[b], .55); strokeBez(P, 0, p); ctx.setLineDash([]);
    if (p >= 1) for (let q = 0; q < 2; q++) packet(P, ((t - d0 - .3) * 1.6 + q * .5 + k * .13) % 1, IN_COL[b], 8);
  });
  // nodes pop on 16ths
  IN_NODES.forEach(([kind, label, x, y], i) => {

  const pos = REPOS.map((_, i) => { const r = i < 5 ? 0 : 1, c = i < 5 ? i : 9 - i; return [ox + c * (bw + gx) + bw / 2, rowY[r] + bh / 2]; });
  const reach = i => .12 + i * .075;
  const P = i => { const [x0, y0] = pos[i], [x1, y1] = pos[i + 1]; if (i === 4) return [[x0, y0 + bh / 2], [x0, y0 + bh / 2 + 60], [x1, y1 - bh / 2 - 60], [x1, y1 - bh / 2]]; const d = x1 > x0 ? 1 : -1; return [[x0 + d * bw / 2, y0], [x0 + d * (bw / 2 + 30), y0], [x1 - d * (bw / 2 + 30), y1], [x1 - d * bw / 2, y1]]; };
  for (let i = 0; i < 9; i++) {
    const p = eInOutCubic(prog(lt, reach(i), reach(i + 1))); if (p <= 0) continue;
    ctx.strokeStyle = rgba(C.green, .85); ctx.lineWidth = 3; strokeBez(P(i), 0, p);
    if (p < 1) packet(P(i), p, '#fff', 14); else packet(P(i), (lt * 1.2 + i * .2) % 1, REPOS[i + 1].acc, 9);
  }
  REPOS.forEach((r, i) => {
    const p = eOutBack(prog(lt, reach(i) - .06, reach(i) + .2), 1.8); if (p <= 0) return;
    const [cx, cy] = pos[i], hit = Math.exp(-Math.max(0, lt - reach(i)) * 5);
    ctx.save(); ctx.translate(cx, cy); ctx.scale(p, p); ctx.translate(-bw / 2, -bh / 2);
    ctx.shadowColor = r.acc; ctx.shadowBlur = 10 + 50 * hit;
    ctx.fillStyle = C.canvas; rrect(0, 0, bw, bh, 14); ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = hit > .3 ? r.acc : C.border; ctx.lineWidth = 2; ctx.stroke();
    ctx.save(); rrect(0, 0, bw, bh, 14); ctx.clip(); ctx.fillStyle = C.surface; ctx.fillRect(0, 0, bw, 46); ctx.fillStyle = r.acc; ctx.fillRect(0, 44, bw, 2); ctx.restore();
    icon(r.kind, 16, 12, 22, r.acc);
    font('700 16px Neon'); txt(`${String(i + 1).padStart(2, '0')} · ${r.type}`, 48, 24, r.acc, 'left', 'middle');
    const nl = nameLayout(r.name, 800, 'Mona', 30, bw - 32, 22); font(`800 ${nl.size}px Mona`);
    nl.lines.forEach((ln, k) => txt(ln, 16, 64 + nl.size * .85 + k * nl.size * 1.05, C.fg));
    const ow = r.owner + '/'; const fs = fit(ow, 400, 'Neon', 16, bw - 64); font(`400 ${fs}px Neon`); txt(ow, 16, bh - 20, C.blue);
    starPath(bw - 26, bh - 26, 10); ctx.fillStyle = C.yellow; ctx.fill();
    ctx.restore();
  });
  // closing line
  const cp = eOutExpo(prog(lt, 1.0, 1.35));
  font('800 46px Mona');
  const a1 = 'Bookmark this. ', a2 = 'Thank me after your next system design round.';
  ctx.font = '800 46px Mona'; const w1 = ctx.measureText(a1).width; ctx.font = '500 40px Mona'; const w2 = ctx.measureText(a2).width;
  const lx = W / 2 - (w1 + w2) / 2;
  font('800 46px Mona'); maskRise(a1, lx, 900, cp, C.green, 46);
  font('500 40px Mona'); maskRise(a2, lx + w1, 900, eOutExpo(prog(lt, 1.08, 1.43)), C.text, 40);
  ctx.restore();
  const f = lt >= 0 ? Math.exp(-lt * 10) : 0; if (f > .01) { ctx.fillStyle = rgba(C.blue, .45 * f); ctx.fillRect(0, 0, W, H); }
}

// ================= master render =================
window.render = function (t, frame = 0) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0; ctx.setLineDash([]);
  let sx = 0, sy = 0;
  for (const [it, amp] of [[T_DROP, 18], [T_OUT, 14]]) if (t >= it) { const a = amp * Math.exp(-(t - it) * 7); sx += Math.sin(t * 91) * a; sy += Math.cos(t * 77) * a; }
  const z = 1 + pulseAt(t, 9) * .008;
  ctx.setTransform(z, 0, 0, z, W / 2 * (1 - z) + sx, H / 2 * (1 - z) + sy);
  if (t < T_DROP) sceneIntro(t);
  else if (t < T_REPO) sceneTitle(t, frame);
  else if (t < T_OUT) sceneRepos(t, frame);
  else sceneOutro(t, frame);
  if (t >= T_DROP && t < T_DROP + .35) { ctx.fillStyle = rgba(C.blue, .6 * Math.exp(-(t - T_DROP) * 12)); ctx.fillRect(-60, -60, W + 120, H + 120); }
  if (t >= T_REPO && t < T_REPO + .3) { ctx.fillStyle = rgba('#fff', .35 * Math.exp(-(t - T_REPO) * 14)); ctx.fillRect(-60, -60, W + 120, H + 120); }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  let g = 0;
  for (const k of [T_DROP, T_REPO, T_OUT]) if (t >= k) g = Math.max(g, Math.exp(-(t - k) * 14));
  sliceGlitch(g, frame * 13 + 1);
  overlays(t, frame);
  watermark();
};
window.ready = (async () => {
  const fams = ['500 50px Mona', '600 50px Mona', '700 50px Mona', '800 50px Mona', '900 50px Mona', 'italic 800 50px Mona', '900 50px Hubot', '400 50px Neon', '600 50px Neon', '700 50px Neon'];
  await Promise.all(fams.map(f => document.fonts.load(f)));
  await document.fonts.ready;
  return true;
})();
if (!navigator.webdriver) {
  (async () => { await window.ready; const t0 = performance.now(); const loop = () => { const t = ((performance.now() - t0) / 1000) % DUR; render(t, Math.floor(t * 60)); requestAnimationFrame(loop); }; loop(); })();
}
</script>
