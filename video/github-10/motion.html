<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>10 Free GitHub Repos</title>
<style>
  @font-face { font-family: Mona; src: url(../fonts/MonaSans-500.woff2); font-weight: 500; }
  @font-face { font-family: Mona; src: url(../fonts/MonaSans-600.woff2); font-weight: 600; }
  @font-face { font-family: Mona; src: url(../fonts/MonaSans-700.woff2); font-weight: 700; }
  @font-face { font-family: Mona; src: url(../fonts/MonaSans-800.woff2); font-weight: 800; }
  @font-face { font-family: Mona; src: url(../fonts/MonaSans-900.woff2); font-weight: 900; }
  @font-face { font-family: Mona; src: url(../fonts/MonaSans-800i.woff2); font-weight: 800; font-style: italic; }
  @font-face { font-family: Hubot; src: url(../fonts/HubotSans-800.woff2); font-weight: 800; }
  @font-face { font-family: Hubot; src: url(../fonts/HubotSans-900.woff2); font-weight: 900; }
  @font-face { font-family: Neon; src: url(../fonts/MonaspaceNeon-400.woff2); font-weight: 400; }
  @font-face { font-family: Neon; src: url(../fonts/MonaspaceNeon-600.woff2); font-weight: 600; }
  @font-face { font-family: Neon; src: url(../fonts/MonaspaceNeon-700.woff2); font-weight: 700; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const layer = mk(), lctx = layer.getContext('2d');

// ---------- palette (GitHub Primer, dark) ----------
const C = {
  bg: '#000000', canvas: '#0D1117', surface: '#161B22', btn: '#21262D', border: '#30363D', faint: '#484F58',
  fg: '#F0F6FC', text: '#C9D1D9', muted: '#8B949E',
  green: '#3FB950', green2: '#2EA043', greenBtn: '#238636', blue: '#58A6FF', purple: '#A371F7',
  orange: '#F0883E', pink: '#DB61A2', yellow: '#E3B341', red: '#F85149',
  g0: '#161B22', g1: '#0E4429', g2: '#006D32', g3: '#26A641', g4: '#39D353',
};
const GREENS = [C.g0, C.g1, C.g2, C.g3, C.g4];
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

// ---------- timing (music: 128 BPM, 8 bars = 15s) ----------
const BEAT = 60 / 128, BAR = BEAT * 4, DUR = 15;
const T_DROP = BAR, T_REPO = BAR * 2, T_OUT = BAR * 7, SLOT = BEAT * 2;
const KICKS = [];
for (let b = 1; b < 7; b++) for (let k = 0; k < 4; k++) KICKS.push(b * BAR + k * BEAT);
KICKS.push(T_OUT, T_OUT + BEAT * 2);

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOutExpo = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const eInExpo = p => p <= 0 ? 0 : Math.pow(2, 10 * p - 10);
const eOutCubic = p => 1 - Math.pow(1 - p, 3);
const eInCubic = p => p * p * p;
const eInOutCubic = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eOutBack = (p, s = 1.7) => p <= 0 ? 0 : 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry(1010);
function pulseAt(t, decay = 7) { let p = 0; for (const k of KICKS) if (t >= k) p = Math.max(p, Math.exp(-(t - k) * decay)); return p; }
function font(f, c = ctx) { c.font = f; }
function txt(s, x, y, color, align = 'left', base = 'alphabetic', c = ctx) { c.fillStyle = color; c.textAlign = align; c.textBaseline = base; c.fillText(s, x, y); }
function fit(s, weight, fam, max, maxW) { ctx.font = `${weight} ${max}px ${fam}`; const w = ctx.measureText(s).width; return w > maxW ? Math.floor(max * maxW / w) : max; }
function typed(s, p) { return s.slice(0, Math.round(s.length * clamp(p))); }
function wrap(s, maxW) {
  const words = s.split(' '), lines = []; let cur = '';
  for (const w of words) { const tt = cur ? cur + ' ' + w : w; if (ctx.measureText(tt).width > maxW && cur) { lines.push(cur); cur = w; } else cur = tt; }
  if (cur) lines.push(cur); return lines;
}
function rrect(x, y, w, h, r, c = ctx) { c.beginPath(); c.roundRect(x, y, w, h, r); }
// text rising out of a clip mask, per-character stagger (keeps kerning via prefix measuring)
function riseChars(s, x, y, size, t0, t, color, stagger = .018, dur = .32, align = 'left') {
  const w = ctx.measureText(s).width;
  const x0 = align === 'left' ? x : align === 'center' ? x - w / 2 : x - w;
  ctx.save(); ctx.beginPath(); ctx.rect(x0 - 30, y - size * 1.05, w + 60, size * 1.4); ctx.clip();
  ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  for (let i = 0; i < s.length; i++) {
    const p = eOutExpo(prog(t, t0 + i * stagger, t0 + i * stagger + dur));
    if (p <= 0) continue;
    const cx = x0 + ctx.measureText(s.slice(0, i)).width;
    ctx.fillText(s[i], cx, y + (1 - p) * size * 1.1);
  }
  ctx.restore();
}
function maskRise(s, x, y, p, color, size, align = 'left') {
  if (p <= 0) return;
  const w = ctx.measureText(s).width;
  const x0 = align === 'left' ? x : align === 'center' ? x - w / 2 : x - w;
  ctx.save(); ctx.beginPath(); ctx.rect(x0 - 20, y - size * 1.05, w + 40, size * 1.4); ctx.clip();
  txt(s, x, y + (1 - p) * size * 1.15, color, align); ctx.restore();
}
function hash7(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16).padStart(8, '0').slice(0, 7); }

// ---------- icons (drawn, Octicon-style) ----------
function iconRepo(x, y, s, color) { // book
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 16, s / 16);
  ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(3, 13); ctx.lineTo(3, 3); ctx.quadraticCurveTo(3, 1.5, 4.5, 1.5); ctx.lineTo(13, 1.5); ctx.lineTo(13, 11.5); ctx.lineTo(4.5, 11.5);
  ctx.quadraticCurveTo(3, 11.5, 3, 13); ctx.quadraticCurveTo(3, 14.5, 4.5, 14.5); ctx.lineTo(6, 14.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(7, 13); ctx.lineTo(7, 16); ctx.lineTo(8.25, 15); ctx.lineTo(9.5, 16); ctx.lineTo(9.5, 13); ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  ctx.restore();
}
function starPath(cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
  ctx.closePath();
}
function iconFork(x, y, s, color) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 16, s / 16); ctx.strokeStyle = color; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  for (const [a, b] of [[4, 3], [12, 3], [8, 13]]) { ctx.beginPath(); ctx.arc(a, b, 1.8, 0, 7); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(4, 5); ctx.lineTo(4, 6.5); ctx.quadraticCurveTo(4, 8, 6, 8); ctx.lineTo(10, 8); ctx.quadraticCurveTo(12, 8, 12, 6.5); ctx.lineTo(12, 5);
  ctx.moveTo(8, 8); ctx.lineTo(8, 11); ctx.stroke(); ctx.restore();
}
function cursor(x, y, press = 0, a = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.translate(x, y); const s = 1.5 * (1 - press * .18); ctx.scale(s, s); ctx.globalAlpha *= a;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 23); ctx.lineTo(6, 17.5); ctx.lineTo(10, 26); ctx.lineTo(13.5, 24.5); ctx.lineTo(9.5, 16.5); ctx.lineTo(17, 16.5); ctx.closePath();
  ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1.6; ctx.lineJoin = 'round'; ctx.stroke(); ctx.restore();
}

// ---------- data ----------
const ACC = [C.green, C.blue, C.purple, C.orange, C.pink, C.yellow, C.green, C.blue, C.purple, C.orange];
const REPOS = [
  ['Archify', 'tt-a1i', 'archify', 'An agent skill that turns your codebase into interactive architecture, workflow, sequence and data-flow diagrams.'],
  ['OpenMAIC', 'THU-MAIC', 'OpenMAIC', 'A multi-agent interactive classroom: AI teachers and classmates turn any topic or document into a full lesson.'],
  ['DeepSeek Harness', 'deepseek-ai', 'deepseek-harness', "DeepSeek's open-source agent harness, built so everything is a plugin."],
  ['Ponytail', 'DietrichGebert', 'ponytail', 'Makes your AI coding agent think like the laziest senior dev in the room, so it writes way less code.'],
  ['Agent Skills', 'addyosmani', 'agent-skills', 'Production-grade engineering skills for AI coding agents.'],
  ['OmniVoice Studio', 'debpalash', 'OmniVoice-Studio', 'A local, open-source ElevenLabs alternative for voice cloning, TTS and dubbing.'],
  ['Scientific Agent Skills', 'K-Dense-AI', 'scientific-agent-skills', 'Turn any AI agent into an AI scientist, with 160+ ready-to-use research skills.'],
  ['Orca', 'stablyai', 'orca', 'Run a fleet of AI coding agents in parallel, each in its own worktree, all tracked in one place.'],
  ['MiniMind', 'jingyaogong', 'minimind', 'Train a tiny 64M-parameter LLM from scratch in about 2 hours.'],
  ["God's Eye View", 'bilawalsidhu', 'gods-eye-view', 'A spy satellite simulator in your browser, powered by real live data on a 3D globe.'],
].map(([name, owner, repo, desc], i) => ({ name, owner, repo, desc, acc: ACC[i], hash: hash7(owner + repo) }));

// ---------- precomputed textures ----------
const dots = mk(); { const d = dots.getContext('2d'); d.fillStyle = '#fff'; for (let y = 18; y < H; y += 36) for (let x = 18; x < W; x += 36) { d.beginPath(); d.arc(x, y, 1.3, 0, 7); d.fill(); } }
const grains = []; for (let g = 0; g < 6; g++) { const c = mk(W / 2, H / 2), d = c.getContext('2d'), im = d.createImageData(W / 2, H / 2);
  for (let i = 0; i < im.data.length; i += 4) { const v = rnd() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 13; } d.putImageData(im, 0, 0); grains.push(c); }
const motes = Array.from({ length: 46 }, () => ({ x: rnd() * W, y: rnd() * H, s: 5 + rnd() * 9, v: 18 + rnd() * 50, ph: rnd() * 7, lvl: 1 + Math.floor(rnd() * 4) }));

// contribution graph (intro)
const GC = 48, GR = 7, CELL = 26, PITCH = 32, GX = (W - GC * PITCH + (PITCH - CELL)) / 2, GY = 452;
const GLV = Array.from({ length: GC * GR }, () => { const r = rnd(); return r < .35 ? 0 : r < .6 ? 1 : r < .8 ? 2 : r < .93 ? 3 : 4; });
const GDL = Array.from({ length: GC * GR }, () => rnd());
const ONE = ['..#..', '.##..', '#.#..', '..#..', '..#..', '..#..', '#####'];
const ZERO = ['.###.', '#...#', '#..##', '#.#.#', '##..#', '#...#', '.###.'];
const GLYPH = new Set(); const GCOL0 = 18;
for (let r = 0; r < 7; r++) for (let c = 0; c < 5; c++) { if (ONE[r][c] === '#') GLYPH.add(r * GC + GCOL0 + c); if (ZERO[r][c] === '#') GLYPH.add(r * GC + GCOL0 + 7 + c); }
const GLYPH_CX = GX + (GCOL0 + 6) * PITCH - (PITCH - CELL) / 2 - PITCH / 2 + CELL / 2, GLYPH_CY = GY + 3 * PITCH + CELL / 2;

// ---------- background ----------
function background(t, gx, gy, gr, acc, ga) {
  ctx.fillStyle = '#000'; ctx.fillRect(-60, -60, W + 120, H + 120);
  const pulse = pulseAt(t);
  // two slow "universe" glows
  const blobs = [[gx, gy, gr * (1 + pulse * .07), acc, ga * (.8 + pulse * .45)],
    [W * .82 + Math.sin(t * .7) * 120, H * .2 + Math.cos(t * .5) * 80, 620, C.purple, ga * .45],
    [W * .15 + Math.cos(t * .6) * 100, H * .9, 560, C.blue, ga * .3]];
  for (const [x, y, r, c, a] of blobs) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgba(c, a)); g.addColorStop(.5, rgba(c, a * .25)); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  ctx.save(); ctx.globalAlpha = .07 + pulse * .05; ctx.drawImage(dots, 0, 0); ctx.restore();
  // travelling scan band over the dot grid
  const by = ((t * 380) % (H + 600)) - 300;
  ctx.save(); ctx.beginPath(); ctx.rect(0, by - 110, W, 220); ctx.clip(); ctx.globalAlpha = .14; ctx.drawImage(dots, 0, 0); ctx.restore();
  // drifting contribution squares
  for (const m of motes) {
    const y = ((m.y - t * m.v) % (H + 100) + H + 100) % (H + 100) - 50;
    const x = m.x + Math.sin(t * .8 + m.ph) * 20;
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t + m.ph) * .4);
    ctx.fillStyle = rgba(GREENS[m.lvl], (.18 + .2 * Math.sin(t * 3 + m.ph) ** 2) * (.6 + pulse * .6));
    rrect(-m.s / 2, -m.s / 2, m.s, m.s, 2); ctx.fill(); ctx.restore();
  }
}
function overlays(t, frame) {
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * 1.1);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(grains[frame % grains.length], 0, 0, W, H);
  ctx.fillStyle = 'rgba(0,0,0,0.08)'; for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
}
function watermark() {
  const s = 'x.com/nrqa__';
  ctx.save();
  font('600 24px Neon');
  txt(s, 56, 62, 'rgba(240,246,252,0.42)', 'left', 'middle');
  txt(s, W - 56, H - 54, 'rgba(240,246,252,0.42)', 'right', 'middle');
  font('600 30px Neon');
  txt(s, W / 2, H / 2, 'rgba(240,246,252,0.15)', 'center', 'middle');
  ctx.restore();
}
// horizontal slice displacement of the finished frame (digital glitch)
function sliceGlitch(amount, seed) {
  if (amount <= .02) return;
  const r = mulberry(seed);
  for (let k = 0; k < 7; k++) {
    const y = Math.floor(r() * H), h = Math.floor(10 + r() * 70), dx = (r() - .5) * 2 * 90 * amount;
    ctx.drawImage(cv, 0, y, W, h, dx, y, W, h);
  }
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .35 * amount;
  ctx.drawImage(cv, 12 * amount, 0); ctx.restore();
}

// ================= SCENE A: intro (0 → drop) =================
function sceneIntro(t) {
  background(t, W / 2, 560, 760, C.green, .05 + .12 * prog(t, .3, 1.6));
  // camera dives into the pixel "10"
  const dive = eInExpo(prog(t, 1.32, T_DROP));
  const z = lerp(1, 26, dive);
  ctx.save(); ctx.translate(GLYPH_CX, GLYPH_CY); ctx.scale(z, z); ctx.translate(-GLYPH_CX, -GLYPH_CY);
  // terminal prompt
  const cmd = 'gh search repos "almost illegal" --price=0';
  font('600 34px Neon');
  const full = '$ ' + cmd, fw = ctx.measureText(full).width, tx = W / 2 - fw / 2;
  const tp = prog(t, .05, .62);
  ctx.globalAlpha = 1 - prog(t, 1.1, 1.35);
  txt('$', tx, 330, C.green);
  const shown = typed(cmd, tp);
  txt(shown, tx + ctx.measureText('$ ').width, 330, C.fg);
  if (Math.floor(t * 5) % 2 || tp < 1) { const cx = tx + ctx.measureText('$ ' + shown).width + 4; ctx.fillStyle = C.green; ctx.fillRect(cx, 302, 18, 34); }
  font('400 24px Neon');
  const found = Math.round(10 * eOutCubic(prog(t, .7, 1.25)));
  txt(tp >= 1 ? `→ ${found} results  ·  sorting by "how is this free?"` : '', W / 2, 392, C.muted, 'center');
  ctx.globalAlpha = 1;
  // contribution graph
  const form = eOutCubic(prog(t, .82, 1.2));
  for (let r = 0; r < GR; r++) for (let c = 0; c < GC; c++) {
    const i = r * GC + c;
    const d = c / GC * .55 + r * .02 + GDL[i] * .08;
    const p = eOutBack(prog(t, .18 + d, .38 + d), 2);
    if (p <= 0) continue;
    const inG = GLYPH.has(i);
    let col = GREENS[GLV[i]];
    let a = 1;
    if (form > 0) { if (inG) col = C.g4; else { a = lerp(1, .35, form); col = GREENS[Math.min(GLV[i], 1)]; } }
    const x = GX + c * PITCH + CELL / 2, y = GY + r * PITCH + CELL / 2;
    const s = CELL * p * (inG ? 1 + .25 * Math.sin(Math.PI * prog(t, .82 + c * .004, 1.05 + c * .004)) : 1);
    ctx.globalAlpha = a; ctx.fillStyle = col; rrect(x - s / 2, y - s / 2, s, s, 5); ctx.fill();
    if (inG && form > 0) { ctx.globalAlpha = form * .5; ctx.shadowColor = C.g4; ctx.shadowBlur = 24; ctx.fill(); ctx.shadowBlur = 0; }
  }
  ctx.globalAlpha = 1;
  // legend
  font('400 20px Neon'); ctx.globalAlpha = eOutCubic(prog(t, .5, .9)) * (1 - prog(t, 1.1, 1.3));
  txt('Less', GX + GC * PITCH - 6 * PITCH - 70, GY + GR * PITCH + 40, C.muted, 'right');
  for (let k = 0; k < 5; k++) { ctx.fillStyle = GREENS[k]; rrect(GX + GC * PITCH - 6 * PITCH - 60 + k * 26, GY + GR * PITCH + 24, 20, 20, 4); ctx.fill(); }
  txt('More', GX + GC * PITCH - 6 * PITCH + 76, GY + GR * PITCH + 40, C.muted);
  txt('contributions to your free-stuff list', GX, GY + GR * PITCH + 40, C.muted);
  ctx.globalAlpha = 1;
  ctx.restore();
  // green-out right before the drop
  const g = prog(t, 1.72, T_DROP);
  if (g > 0) { ctx.fillStyle = rgba(C.g4, g * .9); ctx.fillRect(0, 0, W, H); }
}

// ================= SCENE B: title =================
const tenLayer = mk(760, 760);
function sceneTitle(t, frame) {
  const lt = t - T_DROP;
  background(t, 430, 520, 720, C.green, .22);
  const B = [0, BEAT, BEAT * 2, BEAT * 3];
  // giant "10" with pixel texture, slams in
  const sp = prog(lt, 0, .3);
  const sc = lerp(2.6, 1, eOutBack(sp, 1.3));
  const L = tenLayer.getContext('2d');
  L.clearRect(0, 0, 760, 760);
  L.font = '900 620px Hubot'; L.textAlign = 'center'; L.textBaseline = 'alphabetic';
  const gr = L.createLinearGradient(0, 120, 0, 700); gr.addColorStop(0, '#7CF29A'); gr.addColorStop(.45, C.g4); gr.addColorStop(1, C.g2);
  L.fillStyle = gr; L.fillText('10', 380, 650);
  L.globalCompositeOperation = 'source-atop';
  L.fillStyle = 'rgba(0,0,0,0.55)';
  for (let x = 0; x < 760; x += 22) L.fillRect(x, 0, 4, 760);
  for (let y = 0; y < 760; y += 22) L.fillRect(0, y, 760, 4);
  const sweepX = ((lt * 900) % 1400) - 300;
  const sg = L.createLinearGradient(sweepX - 120, 0, sweepX + 120, 0); sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,255,255,.55)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
  L.fillStyle = sg; L.fillRect(0, 0, 760, 760);
  L.globalCompositeOperation = 'source-over';
  const cx = 430, cy = 540;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(sc, sc);
  for (let k = 3; k >= 1; k--) { const a = (1 - sp) * .3; if (a < .01) break; ctx.save(); ctx.globalAlpha = a / k; const s = 1 + k * .14 * (1 - sp); ctx.scale(s, s); ctx.drawImage(tenLayer, -380, -400); ctx.restore(); }
  for (const k of KICKS) { const age = (t - k) / .5; if (k < T_DROP + .2 || age < 0 || age > 1) continue; ctx.save(); ctx.globalAlpha = .28 * (1 - age); const s = 1 + age * .18; ctx.scale(s, s); ctx.drawImage(tenLayer, -380, -400); ctx.restore(); }
  ctx.drawImage(tenLayer, -380, -400);
  ctx.restore();
  // kicker under the 10
  font('600 22px Neon');
  maskRise('// open source · $0.00 · no trial', cx, 880, eOutExpo(prog(lt, .25, .6)), C.muted, 22, 'center');

  // right column
  const X = 860, MW = 960;
  font('600 22px Neon');
  maskRise('$ cat README.md', X, 200, eOutExpo(prog(lt, .05, .35)), C.green, 22);
  let s1 = fit('GITHUB REPOSITORIES', 900, 'Mona', 110, MW); font(`900 ${s1}px Mona`);
  riseChars('GITHUB REPOSITORIES', X, 310, s1, B[0] + .02, lt, C.fg, .014);
  let s2 = fit('THAT FEEL ALMOST', 800, 'Mona', s1, MW); font(`800 ${s2}px Mona`);
  riseChars('THAT FEEL ALMOST', X, 310 + s1 * 1.08, s2, B[1] - .03, lt, C.muted, .014);
  // ILLEGAL: red redaction bar sweeps over, then glitches
  const IY = 310 + s1 * 1.08 + 228;
  const s3 = fit('ILLEGAL', 900, 'Hubot', 236, MW); font(`900 ${s3}px Hubot`);
  const iw = ctx.measureText('ILLEGAL').width;

  const tp = prog(lt, 1.15, 1.6);
  ctx.globalAlpha = eOutCubic(prog(lt, 1.1, 1.3));
  const tlw = ctx.measureText(tl).width;
  txt(typed(tl, tp), W / 2 - tlw / 2, 940, C.muted);
  if (tp >= 1 && Math.floor(t * 5) % 2) { ctx.fillStyle = C.green; ctx.fillRect(W / 2 + tlw / 2 + 6, 920, 13, 26); }
  ctx.globalAlpha = 1;
  // impact flash
  const f = lt >= 0 ? Math.exp(-lt * 10) : 0;
  if (f > .01) { ctx.fillStyle = rgba(C.g4, .5 * f); ctx.fillRect(0, 0, W, H); }
}

// ================= master render =================
window.render = function (t, frame = 0) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0;
  let sx = 0, sy = 0;
  for (const [it, amp] of [[T_DROP, 18], [T_OUT, 14]]) if (t >= it) { const a = amp * Math.exp(-(t - it) * 7); sx += Math.sin(t * 91) * a; sy += Math.cos(t * 77) * a; }
  const z = 1 + pulseAt(t, 9) * .008;
  ctx.setTransform(z, 0, 0, z, W / 2 * (1 - z) + sx, H / 2 * (1 - z) + sy);

  if (t < T_DROP) sceneIntro(t);
  else if (t < T_REPO) sceneTitle(t, frame);
  else if (t < T_OUT) sceneRepos(t, frame);
  else sceneOutro(t, frame);

  if (t >= T_DROP && t < T_DROP + .35) { ctx.fillStyle = rgba(C.g4, .7 * Math.exp(-(t - T_DROP) * 12)); ctx.fillRect(-60, -60, W + 120, H + 120); }
  diffWipe(t, T_REPO - .36, T_REPO + .34);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // digital glitch on the hard cuts / repo changes
  let g = 0;
  for (const k of [T_DROP, T_OUT]) if (t >= k) g = Math.max(g, Math.exp(-(t - k) * 14));
  if (t >= T_REPO + SLOT && t < T_OUT) { const lt = (t - T_REPO) % SLOT; g = Math.max(g, .6 * Math.exp(-lt * 26)); }
  if (t > T_DROP + BEAT * 2 + .05 && t < T_DROP + BEAT * 2 + .2) g = Math.max(g, .5);
  sliceGlitch(g, frame * 13 + 1);
  overlays(t, frame);
  watermark();
};

window.ready = (async () => {
  const fams = ['500 50px Mona', '600 50px Mona', '700 50px Mona', '800 50px Mona', '900 50px Mona', 'italic 800 50px Mona', '800 50px Hubot', '900 50px Hubot', '400 50px Neon', '600 50px Neon', '700 50px Neon'];
  await Promise.all(fams.map(f => document.fonts.load(f)));
  await document.fonts.ready;
  return true;
})();
if (!navigator.webdriver) {
  (async () => { await window.ready; const t0 = performance.now(); const loop = () => { const t = ((performance.now() - t0) / 1000) % DUR; render(t, Math.floor(t * 60)); requestAnimationFrame(loop); }; loop(); })();
}
</script>
