<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Free Repos A</title>
<style>
  @font-face { font-family: IDBlack; src: url(../../fonts/InterDisplay-Black.otf); }
  @font-face { font-family: IDBold;  src: url(../../fonts/InterDisplay-Bold.otf); }
  @font-face { font-family: IDMed;   src: url(../../fonts/InterDisplay-Medium.otf); }
  @font-face { font-family: NR;      src: url(../../fonts/Newsreader-Italic.ttf); font-style: italic; }
  @font-face { font-family: JBM;     src: url(../../fonts/JetBrainsMono-400.ttf); font-weight: 400; }
  @font-face { font-family: JBM;     src: url(../../fonts/JetBrainsMono-600.ttf); font-weight: 600; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="../common/lib.js"></script>
<script>
// Option A: "Classified" - each repo is a redacted case file that gets declassified.
const PAPER = '#ECECEC';

function background(t) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W * 0.6, H * 0.45, 0, W * 0.6, H * 0.45, 1000);
  g.addColorStop(0, `rgba(255,255,255,${0.06 + pulseAt(t, 6) * 0.03})`); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // scanning line
  const sy = (t * 300) % (H + 200) - 100; ctx.fillStyle = 'rgba(255,255,255,0.04)'; ctx.fillRect(0, sy, W, 3);
}
function seal(x, y, r, t, p = 1) {
  if (p <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.globalAlpha *= p;
  ctx.strokeStyle = C.white; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, r * 0.72, 0, 6.283); ctx.stroke();
  ctx.rotate(t * 0.4);
  font(`600 ${Math.round(r * 0.13)}px JBM`); ctx.fillStyle = C.white; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const s = 'CLASSIFIED · OPEN SOURCE · CLASSIFIED · OPEN SOURCE · ';
  for (let i = 0; i < s.length; i++) { ctx.save(); ctx.rotate(i / s.length * Math.PI * 2); ctx.fillText(s[i], 0, -r * 0.86); ctx.restore(); }
  ctx.restore();
  ghMark(x, y, r * 1.0, C.white, p);
}
function stamp(text, x, y, p, rot = -0.12, size = 64, col = '#000') {
  if (p <= 0) return;
  const s = lerp(2.2, 1, eOutExpo(p));
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s); ctx.globalAlpha *= clamp(p * 3) * 0.9;
  font(`${size}px IDBlack`); const w = ctx.measureText(text).width + 50;
  ctx.strokeStyle = col; ctx.lineWidth = 6; roundRect(-w / 2, -size * 0.75, w, size * 1.3, 10); ctx.stroke();
  txt(text, 0, size * 0.35, col, 'center'); ctx.restore();
}
// text with black redaction bars that peel off left->right
function redacted(lines, x, y, lh, size, fam, p, col = '#111') {
  font(`${size}px ${fam}`);
  lines.forEach((l, k) => {
    const w = ctx.measureText(l).width, q = eInOutCubic(clamp((p - k * 0.15) / 0.6));
    txt(l, x, y + k * lh, col);
    ctx.fillStyle = '#000'; ctx.fillRect(x - 6 + w * q, y + k * lh - size * 0.85, (w + 12) * (1 - q), size * 1.1);
  });
}

function intro(t) {
  seal(W / 2, 430, 190, t, eOutBack(prog(t, 0.05, 0.6), 1.6));
  font('600 30px JBM'); txt(typed('ACCESS LEVEL: PUBLIC', prog(t, 0.7, 1.3)), W / 2, 760, C.white, 'center');
  font('600 22px JBM'); txt(typed('10 FILES · 0 PAYWALLS · 0 LICENSE FEES', prog(t, 1.1, 1.7)), W / 2, 810, C.g2, 'center');
}
function headline(t) {
  const u = t - T_DROP, out = eInExpo(prog(t, T_R0 - 0.2, T_R0));
  ctx.save(); ctx.globalAlpha = 1 - out;
  font('600 30px JBM'); txt('CASE FILE · OPEN SOURCE', 140, 220, C.g2);
  font('130px IDBlack'); maskRise('10 GITHUB REPOS', 140, 380, prog(u, 0, 0.2), C.white, 130);
  font('130px IDBlack'); maskRise('THAT FEEL ALMOST', 140, 520, prog(u, 0.15, 0.35), C.white, 130);
  // ILLEGAL: redaction bar peels off
  font('210px IDBlack'); const w = ctx.measureText('ILLEGAL').width;
  txt('ILLEGAL', 140, 730, C.white);
  const q = eInOutCubic(prog(u, 0.5, 0.85));
  ctx.fillStyle = C.white; ctx.fillRect(130 + w * q, 560, (w + 20) * (1 - q) * (u > 0.3 ? 1 : eOutExpo(prog(u, 0.25, 0.4))), 200);
  font('130px IDBlack'); maskRise('TO BE FREE.', 140 + w + 50, 730, prog(u, 0.85, 1.05), C.g1, 130);
  stamp('LEAKED', 1560, 330, prog(u, 1.0, 1.15), 0.18, 70, C.white);
  ctx.restore();
}
function slotScene(t) {
  const si = clamp(Math.floor((t - T_R0) / R_DUR), 0, N - 1), u = t - SLOT_T(si);
  // case index (left)
  font('600 22px JBM'); txt('CASE INDEX', 100, 150, C.g2);
  REPOS.forEach((r, k) => {
    const y = 210 + k * 74, done = k < si || (k === si && u > 0.32), cur = k === si;
    font('600 22px JBM'); txt(pad2(k + 1), 100, y, cur ? C.white : C.g2);
    font('30px IDBold');
    if (k > si) { ctx.fillStyle = C.g3; ctx.fillRect(150, y - 24, 140 + hash(k) * 160, 30); }
    else { txt(r.name, 150, y, cur ? C.white : C.g1); if (done) { font('600 16px JBM'); txt('DECLASSIFIED', 150, y + 24, C.g2); } }
  });
  // previous paper flies off, current paper lands
  const drawPaper = (i, ox, oy, rot, sc, alpha, uu) => {
    const r = REPOS[i], x = 640, y = 150, w = 1180, h = 780;
    ctx.save(); ctx.translate(x + w / 2 + ox, y + h / 2 + oy); ctx.rotate(rot); ctx.scale(sc, sc); ctx.globalAlpha *= alpha; ctx.translate(-w / 2, -h / 2);
    ctx.fillStyle = PAPER; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(0,0,0,0.05)'; for (let k = 0; k < 18; k++) ctx.fillRect(0, 120 + k * 36, w, 1);
    font('600 24px JBM'); txt(`FILE No. ${pad2(i + 1)} / 10`, 60, 70, '#111'); txt('OPEN SOURCE · FREE', w - 60, 70, '#555', 'right');
    ctx.fillStyle = '#111'; ctx.fillRect(60, 95, w - 120, 4);
    font('600 22px JBM'); txt('SUBJECT', 60, 165, '#666');
    const ns = fit(r.name.toUpperCase(), 'IDBlack', 110, w - 140, 50);
    redacted([r.name.toUpperCase()], 60, 270, 0, ns, 'IDBlack', prog(uu, 0.0, 0.14), '#000');
    font('600 22px JBM'); txt('WHAT IT DOES', 60, 345, '#666');
    font('38px IDMed'); const dl = wrap(r.desc, w - 140);
    redacted(dl, 60, 405, 54, 38, 'IDMed', prog(uu, 0.04, 0.3), '#111');
    font('600 22px JBM'); txt('LOCATION', 60, 405 + dl.length * 54 + 40, '#666');
    redacted([url(r)], 60, 405 + dl.length * 54 + 90, 0, 30, 'JBM', prog(uu, 0.12, 0.34), '#111');
    stamp('DECLASSIFIED', w - 260, h - 110, prog(uu, 0.32, 0.44), -0.14, 52, '#000');
    ctx.restore();
  };
  if (si > 0 && u < 0.25) { const q = eInExpo(prog(u, 0, 0.25)); drawPaper(si - 1, -q * 1400, -q * 200, -q * 0.3, 1, 1 - q * 0.5, 1); }
  const lp = eOutExpo(prog(u, 0, 0.22));
  drawPaper(si, 0, (1 - lp) * 900, (1 - lp) * 0.12 + Math.sin(si * 2.3) * 0.012, 1, 1, u);
}
function recap(t) {
  const u = t - T_RECAP;
  font('110px IDBlack'); maskRise('ALL 10 FILES', 120, 230, prog(u, 0, 0.25), C.white, 110);
  font('110px IDBlack'); maskRise('DECLASSIFIED.', 920, 230, prog(u, 0.1, 0.35), C.g1, 110);
  REPOS.forEach((r, k) => {
    const col = Math.floor(k / 5), row = k % 5, x = 120 + col * 860, y = 380 + row * 120;
    const p = prog(u, 0.15 + k * 0.05, 0.4 + k * 0.05); if (p <= 0) return;
    ctx.save(); ctx.globalAlpha = eOutCubic(p);
    font('600 26px JBM'); txt(pad2(k + 1), x, y, C.g2);
    font('48px IDBlack'); txt(r.name, x + 60, y + 6, C.white);
    font('400 22px JBM'); txt(url(r), x + 60, y + 44, C.g2);
    ctx.restore();
  });
}
function outro(t) {
  const u = t - T_OUT;
  seal(W / 2, 330, 150, t, eOutBack(prog(u, 0, 0.4), 1.8));
  font('150px IDBlack'); const p = prog(u, 0.25, 0.5);
  if (p > 0) { ctx.save(); ctx.translate(W / 2, 680); const s = lerp(1.5, 1, eOutExpo(p)); ctx.scale(s, s); ctx.globalAlpha = clamp(p * 3); txt('LEAKED. LEGALLY.', 0, 0, C.white, 'center'); ctx.restore(); }
  font('italic 60px NR'); maskRise('save the case file before it disappears', W / 2, 780, prog(u, 0.55, 0.85), C.g1, 60, 'center');
  font('600 30px JBM'); txt(typed('follow x.com/nrqa__ for more', prog(u, 0.85, 1.25)), W / 2, 870, C.white, 'center');
}

function render(t, frame) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  background(t);
  let shake = 0; for (const h of [T_DROP, T_OUT]) if (t >= h) shake = Math.max(shake, Math.exp(-(t - h) * 8));
  for (let i = 0; i < N; i++) if (t >= SLOT_T(i) + 0.32) shake = Math.max(shake, 0.35 * Math.exp(-(t - SLOT_T(i) - 0.32) * 14));
  ctx.save(); ctx.translate((hash(frame) - 0.5) * 22 * shake, (hash(frame + 5) - 0.5) * 22 * shake);
  if (t < T_DROP) intro(t); else if (t < T_R0) headline(t); else if (t < T_RECAP) slotScene(t); else if (t < T_OUT) recap(t); else outro(t);
  ctx.restore();
  flashes(t, [[T_DROP, '255,255,255', 0.55], [T_RECAP, '255,255,255', 0.3], [T_OUT, '255,255,255', 0.55]]);
  finish(t, frame);
}
window.ready = FONTS_READY.then(() => render(0, 0));
</script>
</body>
</html>
