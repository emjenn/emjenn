<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Free Repos C</title>
<style>
  @font-face { font-family: IDBlack; src: url(../../fonts/InterDisplay-Black.otf); }
  @font-face { font-family: IDBold;  src: url(../../fonts/InterDisplay-Bold.otf); }
  @font-face { font-family: IDMed;   src: url(../../fonts/InterDisplay-Medium.otf); }
  @font-face { font-family: NR;      src: url(../../fonts/Newsreader-Italic.ttf); font-style: italic; }
  @font-face { font-family: JBM;     src: url(../../fonts/JetBrainsMono-400.ttf); font-weight: 400; }
  @font-face { font-family: JBM;     src: url(../../fonts/JetBrainsMono-600.ttf); font-weight: 600; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="../common/lib.js"></script>
<script>
// Option C: "Lineup" - two police lineups of five; each repo steps forward with its placard.
const T_SWAP = SLOT_T(5);
const XS = k => 230 + k * 365;

function heightChart(t, a) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const labels = ['7′', '6′6″', '6′', '5′6″', '5′', '4′6″', '4′', '3′6″', '3′', '2′6″', '2′'];
  labels.forEach((l, k) => {
    const y = 170 + k * 62, p = eOutExpo(prog(t, 0.2 + k * 0.04, 0.7 + k * 0.04));
    ctx.fillStyle = k % 2 ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.16)'; ctx.fillRect(0, y, W * p, k % 2 ? 1 : 2);
    font('600 18px JBM'); txt(l, 30, y - 8, C.g3); txt(l, W - 30, y - 8, C.g3, 'right');
  });
  ctx.restore();
}
function tape(y, rot, text, p, off) {
  if (p <= 0) return;
  ctx.save(); ctx.translate(W / 2, y); ctx.rotate(rot);
  const w = 2600 * eOutExpo(p);
  ctx.fillStyle = C.white; ctx.fillRect(-w / 2, -42, w, 84);
  ctx.beginPath(); ctx.rect(-w / 2, -42, w, 84); ctx.clip();
  font('44px IDBlack'); const tw = ctx.measureText(text).width;
  for (let x = -1400 - (off % tw); x < 1400; x += tw) txt(text, x, 16, '#000');
  ctx.restore();
}
function suspect(k, idx, x, active, dim, t, u) {
  const r = REPOS[idx];
  ctx.save(); ctx.globalAlpha *= dim;
  const s = active ? 1 + 0.08 * eOutBack(prog(u, 0, 0.2), 2) : 1;
  ctx.translate(x, 0); ctx.translate(0, 560); ctx.scale(s, s); ctx.translate(0, -560);
  // spotlight
  if (active) { const g = ctx.createRadialGradient(0, 250, 0, 0, 500, 520); g.addColorStop(0, 'rgba(255,255,255,0.22)'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(-400, 0, 800, 1080); }
  // body + head (the mark as the head)
  ctx.fillStyle = '#141414'; roundRect(-120, 420, 240, 420, 60); ctx.fill(); ctx.strokeStyle = active ? C.g1 : C.g3; ctx.lineWidth = 2; ctx.stroke();
  ghMark(0, 320, 170, active ? C.white : C.g2);
  // placard
  ctx.save(); ctx.translate(0, 640); ctx.rotate(Math.sin(k * 1.7) * 0.03);
  ctx.fillStyle = C.white; ctx.fillRect(-160, -80, 320, 170);
  font('600 22px JBM'); txt(`No. ${pad2(idx + 1)}`, -140, -48, '#000');
  txt('GITHUB PD', 140, -48, '#555', 'right');
  const ns = fit(r.name.toUpperCase(), 'IDBlack', 40, 290, 18); txt(r.name.toUpperCase(), 0, 10, '#000', 'center');
  font('600 15px JBM'); txt('CHARGE: BEING FREE', 0, 60, '#333', 'center');
  ctx.restore();
  ctx.restore();
  void ns;
}
function lineup(t) {
  const si = clamp(Math.floor((t - T_R0) / R_DUR), 0, N - 1), u = t - SLOT_T(si);
  const group = si < 5 ? 0 : 1;
  // swap: group 0 walks off left, group 1 walks in from the right
  const sw = eInOutCubic(prog(t, T_SWAP - 0.2, T_SWAP + 0.1));
  for (const g of [0, 1]) {
    const off = g === 0 ? -sw * 2000 : (1 - sw) * 2000;
    if ((g === 0 && sw >= 1) || (g === 1 && sw <= 0)) continue;
    for (let k = 0; k < 5; k++) {
      const idx = g * 5 + k, active = idx === si && Math.abs(off) < 10;
      const enter = g === 0 ? eOutBack(prog(t, T_R0 - 0.3 + k * 0.04, T_R0 + 0.05 + k * 0.04), 1.4) : 1;
      suspect(k, idx, XS(k) + off, active, active ? 1 : (idx < si ? 0.55 : 0.3) * enter, t, u);
    }
  }
  // evidence panel
  const r = REPOS[si], p = prog(u, 0.05, 0.2);
  ctx.save(); ctx.globalAlpha = clamp(p * 3);
  ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 860, W, 220);
  ctx.fillStyle = C.white; ctx.fillRect(120, 880, 6, 140);
  font('600 22px JBM'); txt(`EVIDENCE · No. ${pad2(si + 1)} · ${r.name.toUpperCase()}`, 150, 905, C.g2);
  font('34px IDMed'); wrap(r.desc, 1640).slice(0, 2).forEach((l, k) => maskRise(l, 150, 955 + k * 44, prog(u, 0.05 + k * 0.04, 0.22 + k * 0.04), C.white, 34));
  ctx.restore();
  font('600 22px JBM'); txt(`LINEUP ${group + 1} / 2`, 120, 120, C.g2); txt(typed(url(r), prog(u, 0.05, 0.3)), W - 120, 120, C.g1, 'right');
}

function intro(t) {
  heightChart(t, 1);
  font('600 28px JBM'); txt(typed('BOOKING ROOM · GITHUB PD', prog(t, 0.2, 0.8)), 120, 120, C.white);
  const a = eOutBack(prog(t, 0.5, 1.0), 1.6);
  ctx.save(); ctx.globalAlpha = clamp(a);
  const g = ctx.createRadialGradient(W / 2, 250, 0, W / 2, 500, 520); g.addColorStop(0, 'rgba(255,255,255,0.22)'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(W / 2 - 400, 0, 800, 1080);
  ctx.fillStyle = '#141414'; roundRect(W / 2 - 120, 420, 240, 420, 60); ctx.fill();
  ghMark(W / 2, 320, 170 * a, C.white);
  ctx.restore();
  // camera flashes
  for (const f of [0.9, 1.3, 1.6]) { const p = prog(t, f, f + 0.12); if (p > 0 && p < 1) { ctx.fillStyle = `rgba(255,255,255,${0.7 * (1 - p)})`; ctx.fillRect(0, 0, W, H); } }
}
function headline(t) {
  const u = t - T_DROP, out = eInExpo(prog(t, T_R0 - 0.25, T_R0));
  ctx.save(); ctx.globalAlpha = 1 - out;
  heightChart(10, 0.6);
  font('110px IDBlack'); maskRise('10 GITHUB REPOS', W / 2, 330, prog(u, 0, 0.2), C.white, 110, 'center');
  maskRise('THAT FEEL ALMOST', W / 2, 460, prog(u, 0.12, 0.32), C.white, 110, 'center');
  tape(640, -0.05, 'ILLEGAL · ILLEGAL · ILLEGAL · ', prog(u, 0.35, 0.6), t * 300);
  tape(760, 0.04, 'TO BE FREE · TO BE FREE · ', prog(u, 0.6, 0.85), -t * 260);
  ctx.restore();
}
function recap(t) {
  const u = t - T_RECAP;
  heightChart(10, 0.35);
  font('90px IDBlack'); maskRise('ALL 10 CHARGED', 120, 210, prog(u, 0, 0.25), C.white, 90);
  font('italic 70px NR'); maskRise('with being free.', 900, 210, prog(u, 0.12, 0.35), C.g1, 70);
  REPOS.forEach((r, k) => {
    const col = k % 5, row = Math.floor(k / 5), x = 120 + col * 340, y = 300 + row * 330;
    const p = prog(u, 0.15 + k * 0.05, 0.4 + k * 0.05); if (p <= 0) return;
    ctx.save(); ctx.translate(x + 150, y + 140); const s = eOutBack(p, 2); ctx.scale(s, s); ctx.rotate(Math.sin(k * 1.7) * 0.03);
    ctx.fillStyle = C.white; ctx.fillRect(-150, -140, 300, 280);
    ghMark(0, -60, 90, '#000');
    font('600 20px JBM'); txt(`No. ${pad2(k + 1)}`, -130, -112, '#000');
    fit(r.name.toUpperCase(), 'IDBlack', 32, 270, 16); txt(r.name.toUpperCase(), 0, 50, '#000', 'center');
    font('400 14px JBM'); fit(r.path, 'JBM', 15, 270, 10); txt(r.path, 0, 90, '#444', 'center');
    ctx.restore();
  });
}
function outro(t) {
  const u = t - T_OUT;
  tape(300, -0.06, 'CASE CLOSED · CASE CLOSED · ', prog(u, 0, 0.3), t * 300);
  font('150px IDBlack'); const p = prog(u, 0.2, 0.45);
  if (p > 0) { ctx.save(); ctx.translate(W / 2, 620); const s = lerp(1.5, 1, eOutExpo(p)); ctx.scale(s, s); ctx.globalAlpha = clamp(p * 3); txt('GO STAR THEM.', 0, 0, C.white, 'center'); ctx.restore(); }
  font('italic 60px NR'); maskRise('before someone puts a price on them', W / 2, 720, prog(u, 0.5, 0.8), C.g1, 60, 'center');
  font('600 30px JBM'); txt(typed('follow x.com/nrqa__ for more', prog(u, 0.8, 1.2)), W / 2, 810, C.white, 'center');
  tape(940, 0.05, 'ALMOST ILLEGAL · 100% FREE · ', prog(u, 0.3, 0.6), -t * 260);
}

function render(t, frame) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  let shake = 0; for (const h of [T_DROP, T_OUT]) if (t >= h) shake = Math.max(shake, Math.exp(-(t - h) * 8));
  for (let i = 0; i < N; i++) if (t >= SLOT_T(i)) shake = Math.max(shake, 0.3 * Math.exp(-(t - SLOT_T(i)) * 14));
  ctx.save(); ctx.translate((hash(frame) - 0.5) * 22 * shake, (hash(frame + 5) - 0.5) * 22 * shake);
  if (t < T_DROP) intro(t); else if (t < T_R0) headline(t); else if (t < T_RECAP) { heightChart(10, 1); lineup(t); } else if (t < T_OUT) recap(t); else outro(t);
  ctx.restore();
  flashes(t, [[T_DROP, '255,255,255', 0.6], [T_RECAP, '255,255,255', 0.35], [T_OUT, '255,255,255', 0.55]]);
  finish(t, frame);
}
window.ready = FONTS_READY.then(() => render(0, 0));
</script>
</body>
</html>
