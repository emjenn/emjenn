<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GitHub Top 5 C</title>
<style>
  @font-face { font-family: IDBlack; src: url(../../fonts/InterDisplay-Black.otf); }
  @font-face { font-family: IDBold;  src: url(../../fonts/InterDisplay-Bold.otf); }
  @font-face { font-family: IDMed;   src: url(../../fonts/InterDisplay-Medium.otf); }
  @font-face { font-family: NR;      src: url(../../fonts/Newsreader-Italic.ttf); font-style: italic; }
  @font-face { font-family: JBM;     src: url(../../fonts/JetBrainsMono-400.ttf); font-weight: 400; }
  @font-face { font-family: JBM;     src: url(../../fonts/JetBrainsMono-600.ttf); font-weight: 600; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="../common/lib.js"></script>
<script>
// Option C: "Countdown" - brutalist black & white: halftone mark, giant numbers, white panels wiping in.
const ORDER = [4, 3, 2, 1, 0];

// halftone dots sampled from the GitHub mark
const DOTS = [];
(function buildHalftone() {
  const S = 600, c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d');
  g.translate(S / 2, S / 2); g.scale(S / 24 * 0.95, S / 24 * 0.95); g.translate(-12, -12.3); g.fillStyle = '#fff'; g.fill(GH_PATH);
  const d = g.getImageData(0, 0, S, S).data, step = 15;
  for (let y = step / 2; y < S; y += step) for (let x = step / 2; x < S; x += step) {
    const a = d[(Math.floor(y) * S + Math.floor(x)) * 4 + 3] / 255;
    if (a > 0.05) DOTS.push({ x: x - S / 2, y: y - S / 2, a });
  }
})();
function halftoneMark(cx, cy, scale, p, t) {
  for (const d of DOTS) {
    const dist = Math.hypot(d.x, d.y) / 300, q = clamp((p - dist * 0.6) / 0.4);
    if (q <= 0) continue;
    const r = 6.5 * d.a * eOutBack(q, 2) * (0.85 + 0.15 * Math.sin(t * 6 + d.x * 0.05));
    ctx.fillStyle = C.white; ctx.beginPath(); ctx.arc(cx + d.x * scale, cy + d.y * scale, r * scale, 0, 6.283); ctx.fill();
  }
}
function halftoneBg(t, alpha) {
  if (alpha <= 0) return;
  const step = 34, ox = (t * 40) % step;
  for (let y = 0; y < H + step; y += step) for (let x = -step; x < W + step; x += step) {
    const v = 0.5 + 0.5 * Math.sin((x + y) * 0.004 - t * 1.5);
    const r = 1 + v * 4;
    ctx.fillStyle = `rgba(255,255,255,${alpha * (0.05 + v * 0.07)})`; ctx.beginPath(); ctx.arc(x + ox, y, r, 0, 6.283); ctx.fill();
  }
}
function slam(s, x, y, p, color, size, al = 'center') {
  if (p <= 0) return; font(`${size}px IDBlack`);
  ctx.save(); ctx.translate(x, y); const sc = lerp(1.5, 1, eOutExpo(p)); ctx.scale(sc, sc); ctx.globalAlpha *= clamp(p * 4); txt(s, 0, 0, color, al); ctx.restore();
}

function intro(t) {
  halftoneMark(W / 2, 470, 1, prog(t, 0.1, 1.2), t);
  font('600 28px JBM'); txt(typed('THIS WEEK ON GITHUB', prog(t, 0.9, 1.5)), W / 2, 890, C.white, 'center');
  // countdown ticks 5..1 flashing small
  for (let k = 0; k < 5; k++) { const on = t > 1.0 + k * 0.18; font('600 26px JBM'); txt(String(5 - k), W / 2 - 120 + k * 60, 950, on ? C.white : C.g3, 'center'); }
}
function headline(t) {
  const u = t - T_DROP, b = Math.floor(u / BEAT);
  if (b === 0) slam('TOP', W / 2, 760, prog(u, 0, 0.15), C.white, 620);
  else if (b === 1) {
    const w = eOutExpo(prog(u, 0.5, 0.65));
    ctx.fillStyle = C.white; ctx.fillRect(0, 230, W * w, 620);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 230, W * w, 620); ctx.clip(); font('560px IDBlack'); txt('FIVE', W / 2, 760, '#000', 'center'); ctx.restore();
  } else {
    slam('GITHUB', W / 2, 470, prog(u, 1.0, 1.15), C.white, 260);
    font('260px IDBlack'); ctx.save(); ctx.globalAlpha = clamp(prog(u, 1.15, 1.3) * 4); ctx.strokeStyle = C.white; ctx.lineWidth = 4; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.strokeText('REPOS', W / 2, 740); ctx.restore();
    font('600 34px JBM'); txt(typed('[ THIS WEEK ]', prog(u, 1.3, 1.6)), W / 2, 850, C.white, 'center');
  }
}
function slot(t) {
  const si = clamp(Math.floor((t - T_R0) / R_DUR), 0, N - 1), u = t - SLOT_T(si), r = REPOS[ORDER[si]];
  const left = si % 2 === 0, pw = 760;
  // white panel wipes in carrying the giant number
  const wp = eOutExpo(prog(u, 0, 0.22));
  const px = left ? 0 : W - pw * wp, w = pw * wp;
  ctx.fillStyle = C.white; ctx.fillRect(left ? 0 : px, 0, w, H);
  ctx.save(); ctx.beginPath(); ctx.rect(left ? 0 : px, 0, w, H); ctx.clip();
  font('900px IDBlack'); const nx = left ? pw / 2 : W - pw / 2;
  txt(String(r.rank), nx + (1 - eOutExpo(prog(u, 0.05, 0.35))) * (left ? -200 : 200), 860, '#000', 'center');
  font('600 30px JBM'); txt('#' + pad2(r.rank) + ' / 05', left ? 60 : W - pw + 60, 120, '#000');
  ctx.restore();
  // repo text on the black side
  const tx = left ? pw + 90 : 110, maxW = W - pw - 200;
  const parts = r.name.split('-');
  const lines = parts.length > 1 ? parts.map((p, k) => (k < parts.length - 1 ? p + '-' : p)) : [r.name];
  const sz = Math.min(...lines.map(l => fit(l.toUpperCase(), 'IDBlack', 210, maxW, 60)));
  const Y0 = 540 - (lines.length * sz * 0.92 + 120) / 2;
  font('600 30px JBM'); txt(typed(r.owner.toUpperCase() + ' /', prog(u, 0.12, 0.35)), tx, Y0 - 30, C.g1);
  lines.forEach((l, k) => {
    font(`${sz}px IDBlack`);
    const p = prog(u, 0.15 + k * 0.07, 0.35 + k * 0.07); if (p <= 0) return;
    ctx.save(); ctx.beginPath(); ctx.rect(tx - 10, Y0 + k * sz * 0.92, maxW + 40, sz * 0.95); ctx.clip();
    txt(l.toUpperCase(), tx + (1 - eOutExpo(p)) * (left ? 300 : -300), Y0 + (k + 0.8) * sz * 0.92, C.white);
    ctx.restore();
  });
  const yEnd = Y0 + lines.length * sz * 0.92 + 70;
  ctx.fillStyle = C.white; ctx.fillRect(tx, yEnd - 40, maxW * eOutExpo(prog(u, 0.35, 0.7)), 4);
  font('400 30px JBM'); txt(typed(r.url, prog(u, 0.4, 0.85)), tx, yEnd + 10, C.g1);
}
function recap(t) {
  const u = t - T_RECAP;
  font('600 26px JBM'); txt('TOP 5 · GITHUB · THIS WEEK', 100, 130, C.g1);
  REPOS.forEach((r, k) => {
    const p = prog(u, 0.05 + k * 0.06, 0.25 + k * 0.06); if (p <= 0) return;
    const y = 200 + k * 160, inv = k % 2 === 0;
    const w = (W - 200) * eOutExpo(p);
    if (inv) { ctx.fillStyle = C.white; ctx.fillRect(100, y, w, 140); }
    else { ctx.strokeStyle = C.white; ctx.lineWidth = 3; ctx.strokeRect(100, y, w, 140); }
    ctx.save(); ctx.beginPath(); ctx.rect(100, y, w, 140); ctx.clip();
    font('120px IDBlack'); txt(String(r.rank), 150, y + 118, inv ? '#000' : C.white);
    const s = fit(r.name.toUpperCase(), 'IDBlack', 96, 1000, 40); txt(r.name.toUpperCase(), 290, y + 104, inv ? '#000' : C.white);
    font('400 24px JBM'); txt(r.owner, W - 140, y + 82, inv ? '#333' : C.g2, 'right');
    ctx.restore();
    void s;
  });
}
function outro(t) {
  const u = t - T_OUT;
  halftoneMark(W / 2, 330, 0.55, prog(u, 0, 0.8), t);
  slam('GO STAR THEM.', W / 2, 720, prog(u, 0.25, 0.45), C.white, 170);
  font('italic 60px NR'); maskRise('five repos worth your weekend', W / 2, 810, prog(u, 0.55, 0.85), C.g1, 60, 'center');
  font('600 30px JBM'); txt(typed('follow x.com/nrqa__ for more', prog(u, 0.85, 1.25)), W / 2, 900, C.white, 'center');
}

function render(t, frame) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  halftoneBg(t, t < T_DROP ? 0.6 : 1);
  let shake = 0; for (const h of [T_DROP, T_DROP + 0.5, T_DROP + 1, T_OUT]) if (t >= h) shake = Math.max(shake, Math.exp(-(t - h) * 10));
  for (let i = 0; i < N; i++) if (t >= SLOT_T(i)) shake = Math.max(shake, 0.6 * Math.exp(-(t - SLOT_T(i)) * 12));
  ctx.save(); ctx.translate((hash(frame) - 0.5) * 26 * shake, (hash(frame + 5) - 0.5) * 26 * shake);
  if (t < T_DROP) intro(t); else if (t < T_R0) headline(t); else if (t < T_RECAP) slot(t); else if (t < T_OUT) recap(t); else outro(t);
  ctx.restore();
  // full-frame invert hits on the drop and outro (difference blend keeps it black/white)
  for (const h of [T_DROP, T_OUT]) { const p = prog(t, h, h + 0.12); if (p > 0 && p < 1) { ctx.save(); ctx.globalCompositeOperation = 'difference'; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.restore(); } }
  finish(t, frame);
}
window.ready = FONTS_READY.then(() => render(0, 0));
</script>
</body>
</html>
