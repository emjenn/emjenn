<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>10 Free AI Courses</title>
<style>
  @font-face { font-family: IDBlack; src: url(../fonts/InterDisplay-Black.otf); }
  @font-face { font-family: IDBold;  src: url(../fonts/InterDisplay-Bold.otf); }
  @font-face { font-family: IDSemi;  src: url(../fonts/InterDisplay-SemiBold.otf); }
  @font-face { font-family: IDMed;   src: url(../fonts/InterDisplay-Medium.otf); }
  @font-face { font-family: NR;      src: url(../fonts/Newsreader-Italic.ttf); font-style: italic; }
  @font-face { font-family: JBM;     src: url(../fonts/JetBrainsMono-400.ttf); font-weight: 400; }
  @font-face { font-family: JBM;     src: url(../fonts/JetBrainsMono-600.ttf); font-weight: 600; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const CREAM = '#F2F0EA', GREY = '#9A9893', DIM = '#55544F';
const rgba = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
};

// ---------- brands ----------
const BRANDS = [
  { id: 'anthropic', name: 'Anthropic',       url: 'anthropic.skilljar.com',             main: '#D97757', pal: ['#D97757', '#F0EEE6', '#C15F3C'] },
  { id: 'google',    name: 'Google',          url: 'grow.google/ai',                     main: '#4285F4', pal: ['#4285F4', '#EA4335', '#FBBC05', '#34A853'] },
  { id: 'meta',      name: 'Meta',            url: 'ai.meta.com/learn',                  main: '#0081FB', pal: ['#0064E0', '#0081FB', '#00C2FF'] },
  { id: 'nvidia',    name: 'NVIDIA',          url: 'nvidia.com/en-us/training',          main: '#76B900', pal: ['#76B900', '#A4E000'] },
  { id: 'microsoft', name: 'Microsoft',       url: 'learn.microsoft.com/en-us/training', main: '#00A4EF', pal: ['#F25022', '#7FBA00', '#00A4EF', '#FFB900'] },
  { id: 'openai',    name: 'OpenAI',          url: 'academy.openai.com',                 main: '#FFFFFF', pal: ['#FFFFFF', '#10A37F'] },
  { id: 'ibm',       name: 'IBM',             url: 'skillsbuild.org',                    main: '#0F62FE', pal: ['#0F62FE', '#4589FF', '#78A9FF'] },
  { id: 'aws',       name: 'AWS',             url: 'skillbuilder.aws',                   main: '#FF9900', pal: ['#FF9900', '#FFB84D'] },
  { id: 'dlai',      name: 'DeepLearning.AI', url: 'deeplearning.ai/courses',            main: '#F65B66', pal: ['#F65B66', '#FF8A8F'] },
  { id: 'hf',        name: 'Hugging Face',    url: 'huggingface.co/learn',               main: '#FFD21E', pal: ['#FFD21E', '#FF9D00'] },
];
const RAINBOW = BRANDS.map(b => b.id === 'openai' ? '#10A37F' : b.main);

// ---------- timing (music: 128 BPM) ----------
const BEAT = 60 / 128, BAR = BEAT * 4, SLOT = BEAT * 2;
const T_DROP = BAR, T_LIST = BAR * 2, T_OUT = BAR * 7, DUR = 15;
const KICKS = [];
for (let b = 1; b < 7; b++) for (let k = 0; k < 4; k++) KICKS.push(b * BAR + k * BEAT);
KICKS.push(T_OUT, T_OUT + BEAT * 2);
const slotStart = i => T_LIST + i * SLOT;

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOutExpo = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const eInExpo = p => p <= 0 ? 0 : Math.pow(2, 10 * p - 10);
const eOutCubic = p => 1 - Math.pow(1 - p, 3);
const eInOutCubic = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eOutBack = (p, s = 1.7) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);
const eOutElastic = p => p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, -10 * p) * Math.sin((p * 10 - .75) * (2 * Math.PI) / 3) + 1;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry(42);

function pulseAt(t, decay = 7) {
  let p = 0;
  for (const k of KICKS) if (t >= k) p = Math.max(p, Math.exp(-(t - k) * decay));
  return p;
}
function font(f) { ctx.font = f; }
function txt(s, x, y, color, align = 'left', base = 'alphabetic') {
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(s, x, y);
}
function maskRise(s, x, y, p, color, size, align = 'left', dist = 1.15) {
  if (p <= 0) return;
  const w = ctx.measureText(s).width;
  const x0 = align === 'left' ? x : align === 'center' ? x - w / 2 : x - w;
  ctx.save();
  ctx.beginPath(); ctx.rect(x0 - 30, y - size * 1.0, w + 60, size * 1.28); ctx.clip();
  txt(s, x, y + (1 - p) * size * dist, color, align);
  ctx.restore();
}
function typed(s, p) { return s.slice(0, Math.round(s.length * clamp(p))); }
const SCR = '!<>-_\\/[]{}=+*^?#01';
function scramble(s, p, seed = 0) { // decode-style text reveal
  const n = s.length, out = [];
  for (let i = 0; i < n; i++) {
    const r = clamp(p * 1.6 - i / n * .6);
    if (r >= 1 || s[i] === ' ' || s[i] === '.' || s[i] === '/') out.push(s[i]);
    else if (r > 0) out.push(SCR[(i * 7 + seed + Math.floor(p * 40)) % SCR.length]);
  }
  return out.join('');
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// ---------- precomputed layers ----------
const grains = [];
for (let k = 0; k < 6; k++) {
  const g = document.createElement('canvas'); g.width = 960; g.height = 540;
  const gx = g.getContext('2d'); const im = gx.createImageData(960, 540); const r = mulberry(100 + k);
  for (let i = 0; i < im.data.length; i += 4) { im.data[i] = im.data[i + 1] = im.data[i + 2] = 255; im.data[i + 3] = r() * 10; }
  gx.putImageData(im, 0, 0); grains.push(g);
}
const dots = document.createElement('canvas'); dots.width = W; dots.height = H;
{ const d = dots.getContext('2d'); d.fillStyle = CREAM;
  for (let x = 24; x < W; x += 48) for (let y = 24; y < H; y += 48) { d.beginPath(); d.arc(x, y, 1.2, 0, 7); d.fill(); } }
const particles = Array.from({ length: 140 }, () => ({ x: rnd() * W, y: rnd() * H, v: 30 + rnd() * 120, s: .6 + rnd() * 2.4, ph: rnd() * 7, a: .2 + rnd() * .6, c: Math.floor(rnd() * 10) }));

// ---------- background ----------
function background(t, gx, gy, gr, color, ga, tint = null) {
  ctx.fillStyle = '#000'; ctx.fillRect(-60, -60, W + 120, H + 120);
  const pulse = pulseAt(t);
  const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr * (1 + pulse * .1));
  g.addColorStop(0, rgba(color, ga * (0.7 + pulse * .5)));
  g.addColorStop(.5, rgba(color, ga * .18));
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = 0.06 + pulse * 0.04; ctx.drawImage(dots, 0, 0); ctx.restore();
  // travelling light band on the dot grid
  const bandX = ((t * 520) % (W + 800)) - 400;
  ctx.save(); ctx.beginPath(); ctx.rect(bandX - 140, 0, 280, H); ctx.clip();
  ctx.globalAlpha = 0.13; ctx.drawImage(dots, 0, 0); ctx.restore();
  // drifting particles (tinted to scene brand, or rainbow)
  for (const e of particles) {
    const x = ((e.x - t * e.v) % W + W) % W;
    const y = e.y + Math.sin(t * 1.3 + e.ph) * 14;
    ctx.fillStyle = rgba(tint || RAINBOW[e.c], e.a * (0.5 + 0.5 * Math.sin(t * 5 + e.ph)) * (0.5 + pulse * .6));
    ctx.fillRect(x, y, e.s * 6, e.s * .9);
  }
}
function overlays(t, frame) {
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.72)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(grains[frame % grains.length], 0, 0, W, H);
  ctx.fillStyle = 'rgba(0,0,0,0.09)';
  for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
}
function watermark() {
  const s = 'x.com/nrqa__';
  ctx.save();
  font('500 24px IDMed');
  txt(s, 56, 62, 'rgba(242,240,234,0.40)', 'left', 'middle');
  txt(s, W - 56, H - 50, 'rgba(242,240,234,0.40)', 'right', 'middle');
  font('500 30px IDMed');
  txt(s, W / 2, H / 2, 'rgba(242,240,234,0.16)', 'center', 'middle');
  ctx.restore();
}

// ---------- Anthropic-style spark ----------
const RAY_L = [1, .74, .93, .7, .98, .79, .9, .72, 1, .77, .87, .73];
const RAY_J = RAY_L.map((_, i) => Math.sin(i * 12.9898) * 0.06);
function spark(x, y, r, p, rot, color) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = color;
  for (let i = 0; i < 12; i++) {
    const pi = clamp((p - i * 0.035) / 0.55);
    if (pi <= 0) continue;
    const len = r * RAY_L[i] * eOutBack(pi, 1.4);
    const a = i * Math.PI / 6 + RAY_J[i];
    const w0 = r * 0.075, w1 = r * 0.04;
    const ca = Math.cos(a), sa = Math.sin(a), px = -sa, py = ca;
    ctx.beginPath();
    ctx.moveTo(px * w0, py * w0);
    ctx.lineTo(ca * len + px * w1, sa * len + py * w1);
    ctx.arc(ca * len, sa * len, w1, a + Math.PI / 2, a - Math.PI / 2, true);
    ctx.lineTo(-px * w0, -py * w0);
    ctx.closePath(); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(0, 0, r * 0.11 * clamp(p * 3), 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ================= brand motifs =================
// p: 0..1 build-in, lt: local seconds, k: beat pulse 0..1
const MOTIF = {
  anthropic(cx, cy, r, p, lt, k, B) {
    for (let i = 0; i < 3; i++) {
      const age = (lt * 1.1 + i / 3) % 1;
      ctx.strokeStyle = rgba(B.main, .35 * (1 - age) * p); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, r * (.5 + age * .9), 0, 7); ctx.stroke();
    }
    spark(cx, cy, r * (.95 + k * .08), p, lt * 1.6, B.main);
  },
  google(cx, cy, r, p, lt, k, B) {
    const rot = lt * 2.4 - Math.PI / 2;
    ctx.lineCap = 'butt';
    for (let i = 0; i < 4; i++) {
      const pi = eOutExpo(clamp(p * 1.4 - i * .1));
      if (pi <= 0) continue;
      ctx.strokeStyle = B.pal[i]; ctx.lineWidth = r * .2;
      const a0 = rot + i * Math.PI / 2 + .06;
      ctx.beginPath(); ctx.arc(cx, cy, r * .78, a0, a0 + (Math.PI / 2 - .12) * pi); ctx.stroke();
    }
    // bouncing loader dots inside
    for (let i = 0; i < 4; i++) {
      const pi = eOutBack(clamp(p * 1.6 - .3 - i * .08));
      if (pi <= 0) continue;
      const x = cx + (i - 1.5) * r * .3, y = cy - Math.abs(Math.sin(lt * 9 - i * .7)) * r * .22 * (1 + k) + r * .08;
      ctx.fillStyle = B.pal[i]; ctx.beginPath(); ctx.arc(x, y, r * .1 * pi, 0, 7); ctx.fill();
    }
  },
  meta(cx, cy, r, p, lt, k, B) {
    const pts = [];
    const n = 220, a = r * 1.15;
    for (let i = 0; i <= n; i++) {
      const s = i / n * Math.PI * 2 + Math.PI / 2;
      const d = 1 + Math.sin(s) ** 2;
      pts.push([cx + a * Math.cos(s) / d, cy + a * .9 * Math.sin(s) * Math.cos(s) / d * (1 + .25 * Math.sin(lt * 3))]);
    }
    const m = Math.floor(n * eInOutCubic(p));
    const g = ctx.createLinearGradient(cx - a, cy, cx + a, cy);
    g.addColorStop(0, B.pal[0]); g.addColorStop(.5, B.pal[1]); g.addColorStop(1, B.pal[2]);
    ctx.strokeStyle = g; ctx.lineWidth = r * .17 * (1 + k * .15); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(...pts[0]); for (let i = 1; i <= m; i++) ctx.lineTo(...pts[i]); ctx.stroke();
    // light comet travelling the loop
    if (p >= 1) {
      const j = Math.floor((lt * 160) % n);
      for (let q = 0; q < 18; q++) {
        const pt = pts[(j - q * 2 + n) % n];
        ctx.fillStyle = `rgba(255,255,255,${.7 * (1 - q / 18)})`;
        ctx.beginPath(); ctx.arc(pt[0], pt[1], r * .05 * (1 - q / 22), 0, 7); ctx.fill();
      }
    }
  },
  nvidia(cx, cy, r, p, lt, k, B) {
    // spiral "eye" of arcs
    ctx.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
      const pi = eOutExpo(clamp(p * 1.5 - i * .08));
      if (pi <= 0) continue;
      const rr = r * (.25 + i * .14);
      const a0 = lt * (i % 2 ? -2.2 : 1.6) + i * .9;
      ctx.strokeStyle = rgba(i % 2 ? B.pal[1] : B.main, .95 - i * .08);
      ctx.lineWidth = r * (.11 - i * .012);
      ctx.beginPath(); ctx.arc(cx, cy, rr, a0, a0 + Math.PI * (1.25 + .2 * Math.sin(lt * 4 + i)) * pi); ctx.stroke();
    }
    // pixel grid flicker (GPU cores)
    const gs = r * .09;
    for (let x = -2; x <= 2; x++) for (let y = -2; y <= 2; y++) {
      if (Math.abs(x) + Math.abs(y) > 2) continue;
      const on = (Math.floor(lt * 14) + x * 3 + y * 5) % 4 === 0;
      ctx.fillStyle = rgba(B.main, (on ? .95 : .3) * p);
      ctx.fillRect(cx + x * gs * 1.2 - gs / 2, cy + y * gs * 1.2 - gs / 2, gs, gs);
    }
  },
  microsoft(cx, cy, r, p, lt, k, B) {
    const s = r * .62, g = r * .06;
    ctx.save(); ctx.translate(cx, cy);
    ctx.rotate((1 - eOutBack(clamp(p * 1.2), 1.3)) * Math.PI / 2 + Math.sin(lt * 2) * .05);
    const pos = [[-1, -1], [1, -1], [-1, 1], [1, 1]];
    pos.forEach(([x, y], i) => {
      const pi = eOutBack(clamp(p * 1.6 - i * .12), 2.2);
      if (pi <= 0) return;
      const off = (g / 2 + s / 2) * (1 + k * .18 + Math.max(0, Math.sin(lt * 6 - i)) * .06);
      ctx.save(); ctx.translate(x * off, y * off); ctx.scale(pi, pi);
      ctx.fillStyle = B.pal[i]; ctx.fillRect(-s / 2, -s / 2, s, s);
      ctx.restore();
    });
    ctx.restore();
  },
  openai(cx, cy, r, p, lt, k, B) {
    // six interlocking capsules rotating (abstract rosette)
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(lt * .9);
    ctx.lineWidth = r * .085; ctx.lineJoin = 'round';
    for (let i = 0; i < 6; i++) {
      const pi = eOutExpo(clamp(p * 1.5 - i * .07));
      if (pi <= 0) continue;
      ctx.save(); ctx.rotate(i * Math.PI / 3);
      ctx.translate(0, -r * .32 * pi * (1 + k * .1));
      ctx.strokeStyle = i % 2 ? '#FFFFFF' : rgba('#FFFFFF', .85);
      roundRect(-r * .22, -r * .5, r * .44, r * .82 * pi, r * .22); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
    ctx.fillStyle = rgba(B.pal[1], .9 * p); ctx.beginPath(); ctx.arc(cx, cy, r * .09 * (1 + k * .5), 0, 7); ctx.fill();
  },
  ibm(cx, cy, r, p, lt, k, B) {
    // striped block — eight horizontal bars sliding in from alternating sides
    const n = 8, bh = r * 1.6 / (n * 2 - 1), w = r * 1.7;
    for (let i = 0; i < n; i++) {
      const pi = eOutExpo(clamp(p * 1.7 - i * .07));
      if (pi <= 0) continue;
      const dir = i % 2 ? 1 : -1;
      const ww = w * (0.55 + 0.45 * Math.abs(Math.sin(i * 1.7 + lt * 3 + k)));
      const x = cx - ww / 2 + dir * (1 - pi) * 500;
      ctx.fillStyle = B.pal[i % 3 === 0 ? 0 : i % 3];
      ctx.globalAlpha = pi;
      ctx.fillRect(x, cy - r * .8 + i * bh * 2, ww, bh);
    }
    ctx.globalAlpha = 1;
  },
  aws(cx, cy, r, p, lt, k, B) {
    // stacked isometric cubes (cloud building blocks) + the smile arrow
    const cube = (x, y, s, a) => {
      const h = s * .58;
      ctx.globalAlpha = a;
      ctx.fillStyle = B.main; ctx.beginPath(); ctx.moveTo(x, y - s); ctx.lineTo(x + s * .87, y - s + h); ctx.lineTo(x, y - s + 2 * h); ctx.lineTo(x - s * .87, y - s + h); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#B86E00'; ctx.beginPath(); ctx.moveTo(x - s * .87, y - s + h); ctx.lineTo(x, y - s + 2 * h); ctx.lineTo(x, y + h * .9); ctx.lineTo(x - s * .87, y + h * .9 - h); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#E08700'; ctx.beginPath(); ctx.moveTo(x + s * .87, y - s + h); ctx.lineTo(x, y - s + 2 * h); ctx.lineTo(x, y + h * .9); ctx.lineTo(x + s * .87, y + h * .9 - h); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    };
    const s = r * .34;
    const spots = [[0, -.35], [-.6, .05], [.6, .05], [0, .42]];
    spots.forEach(([dx, dy], i) => {
      const pi = eOutBack(clamp(p * 1.7 - i * .12), 2);
      if (pi <= 0) return;
      const bob = Math.sin(lt * 5 + i) * r * .03 + (i === 0 ? -k * r * .08 : 0);
      cube(cx + dx * r, cy + dy * r - (1 - pi) * 200 + bob - r * .15, s, clamp(pi));
    });
    // smile arrow
    const sp = eOutExpo(prog(p, .4, 1));
    if (sp > 0) {
      ctx.strokeStyle = B.main; ctx.lineWidth = r * .07; ctx.lineCap = 'round';
      const a0 = Math.PI * .2, a1 = Math.PI * .8;
      ctx.beginPath(); ctx.arc(cx, cy - r * .55, r * 1.25, a1, a1 - (a1 - a0) * sp, true); ctx.stroke();
      const ea = a1 - (a1 - a0) * sp;
      const ex = cx + Math.cos(ea) * r * 1.25, ey = cy - r * .55 + Math.sin(ea) * r * 1.25;
      ctx.beginPath(); ctx.moveTo(ex - r * .14, ey - r * .02); ctx.lineTo(ex + r * .02, ey - r * .04); ctx.lineTo(ex - r * .02, ey + r * .12); ctx.stroke();
    }
  },
  dlai(cx, cy, r, p, lt, k, B) {
    const layers = [3, 4, 4, 2];
    const nodes = layers.map((n, li) => Array.from({ length: n }, (_, i) => [cx + (li - 1.5) * r * .62, cy + (i - (n - 1) / 2) * r * .48]));
    ctx.lineWidth = 2.2;
    for (let li = 0; li < 3; li++) {
      const lp = clamp(p * 2.2 - li * .35);
      nodes[li].forEach((a, ai) => nodes[li + 1].forEach((b, bi) => {
        if (lp <= 0) return;
        ctx.strokeStyle = rgba(B.main, .35);
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(lerp(a[0], b[0], lp), lerp(a[1], b[1], lp)); ctx.stroke();
        // signal pulses
        if (lp >= 1) {
          const q = (lt * 2.2 + ai * .37 + bi * .21 + li * .5) % 1;
          ctx.fillStyle = rgba(B.pal[1], .9);
          ctx.beginPath(); ctx.arc(lerp(a[0], b[0], q), lerp(a[1], b[1], q), 3.5, 0, 7); ctx.fill();
        }
      }));
    }
    nodes.forEach((L, li) => L.forEach(([x, y], i) => {
      const pi = eOutBack(clamp(p * 2.2 - li * .35 - i * .05), 2);
      if (pi <= 0) return;
      const fire = Math.max(0, Math.sin(lt * 8 - li * 1.3 + i));
      ctx.fillStyle = '#000'; ctx.strokeStyle = B.main; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(x, y, r * .1 * pi * (1 + k * .2), 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = rgba(B.main, fire);
      ctx.beginPath(); ctx.arc(x, y, r * .055 * pi, 0, 7); ctx.fill();
    }));
  },
  hf(cx, cy, r, p, lt, k, B) {
    const s = eOutElastic(clamp(p * 1.1)) * (1 + k * .06);
    if (s <= 0) return;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.sin(lt * 4) * .08); ctx.scale(s, s);
    ctx.fillStyle = B.pal[0]; ctx.beginPath(); ctx.arc(0, 0, r * .78, 0, 7); ctx.fill();
    // eyes (blink once)
    const blink = Math.abs(lt - .55) < .05 ? .15 : 1;
    ctx.fillStyle = '#3A3B45';
    for (const ex of [-1, 1]) { ctx.beginPath(); ctx.ellipse(ex * r * .26, -r * .14, r * .08, r * .1 * blink, 0, 0, 7); ctx.fill(); }
    // smile

// brand-colored slab transition
function slab(t, t0, dur, colors, dir = 1) {
  const p = prog(t, t0, t0 + dur);
  if (p <= 0 || p >= 1) return;
  const e = eInOutCubic(p);
  const skew = 300, totalW = W + 2 * skew + 600;
  const n = colors.length;
  for (let i = 0; i < n; i++) {
    const lag = i * .06;
    const ee = clamp((e - lag) / (1 - lag * (n - 1) / n));
    const xc = lerp(-totalW, W + skew, dir > 0 ? ee : 1 - ee);
    const w = i === n - 1 ? W + 400 : 70 + i * 30;
    ctx.fillStyle = colors[i];
    // each band trails the previous one
    const x = dir > 0 ? xc + (n - 1 - i) * 0 : xc;
    ctx.beginPath();
    ctx.moveTo(x + skew, 0); ctx.lineTo(x + skew + w, 0); ctx.lineTo(x + w, H); ctx.lineTo(x, H); ctx.closePath(); ctx.fill();
  }
}
// quick bars wipe (used between companies)
function barsWipe(t, t0, color, dir) {
  const d = .22, p = prog(t, t0 - d / 2, t0 + d / 2);
  if (p <= 0 || p >= 1) return;
  const n = 9, bh = H / n;
  for (let i = 0; i < n; i++) {
    const q = clamp(p * 1.6 - (dir > 0 ? i : n - 1 - i) * .07);
    // in: grow from one side, out: shrink to the other
    const a = eInOutCubic(clamp(q * 2)), b = eInOutCubic(clamp(q * 2 - 1));
    const x0 = dir > 0 ? b * W : (1 - a) * W, x1 = dir > 0 ? a * W : (1 - b) * W;
    ctx.fillStyle = i % 3 === 1 ? CREAM : color;
    ctx.fillRect(Math.min(x0, x1), i * bh, Math.abs(x1 - x0), bh + 1);
  }
}

  for (let i = 0; i < 10; i++) { const it = slotStart(i); if (t >= it) { const a = 6 * Math.exp(-(t - it) * 12); sx += Math.sin(t * 113) * a; sy += Math.cos(t * 97) * a; } }
  const z = 1 + pulseAt(t, 9) * .01;
  ctx.setTransform(z, 0, 0, z, W / 2 * (1 - z) + sx, H / 2 * (1 - z) + sy);

  if (t < T_DROP) sceneIntro(t);
  else if (t < T_LIST) sceneHero(t);
  else if (t < T_OUT) sceneCompany(t);
  else sceneOutro(t, frame);

  if (t >= T_DROP && t < T_DROP + .3) { ctx.fillStyle = `rgba(255,255,255,${.7 * Math.exp(-(t - T_DROP) * 14)})`; ctx.fillRect(-60, -60, W + 120, H + 120); }
  // transitions
  slab(t, T_LIST - .38, .7, [...RAINBOW.slice(0, 9), BRANDS[0].main]);
  for (let i = 1; i < 10; i++) barsWipe(t, slotStart(i), RAINBOW[i], i % 2 ? 1 : -1);
  slab(t, T_OUT - .32, .6, [...RAINBOW].reverse(), -1);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  overlays(t, frame);
  watermark();
};

window.ready = (async () => {
  const fams = ['900 50px IDBlack', '600 50px IDSemi', '500 50px IDMed', 'italic 400 50px NR', '400 50px JBM', '600 50px JBM'];
  await Promise.all(fams.map(f => document.fonts.load(f)));
  await document.fonts.ready;
  return true;
})();
if (!navigator.webdriver) {
  (async () => { await window.ready; const t0 = performance.now(); const loop = () => { const t = ((performance.now() - t0) / 1000) % DUR; render(t, Math.floor(t * 60)); requestAnimationFrame(loop); }; loop(); })();
}
</script>
