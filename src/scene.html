<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Claude Courses Motion</title>
<style>
  @font-face { font-family: 'Serif'; font-style: italic; src: url('file:///usr/share/fonts/truetype/crosextra/Caladea-Italic.ttf'); }
  @font-face { font-family: 'Serif'; font-style: normal; src: url('file:///usr/share/fonts/truetype/crosextra/Caladea-Regular.ttf'); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// =====================================================================
//  20 FREE Claude AI Courses — 15 s, 16:9, deterministic renderFrame(t)
//  Beat grid: 120 BPM (beat = 0.5 s). Cuts: 2.0 | 4.0 | 5.5 | 7.0 | 8.5 | 9.5 | 12.0
// =====================================================================
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  orange: '#D97757', clay: '#C15F3C', kraft: '#D4A27F', manilla: '#EBDBBC',
  ivory: '#F0EEE6', gray: '#8C887E', line: 'rgba(240,238,230,0.10)', card: '#0D0B0A',
};
const F = {
  display: (w, s) => `${w} ${s}px "Inter Display", Inter, sans-serif`,
  sans: (w, s) => `${w} ${s}px Inter, sans-serif`,
  serif: (s) => `italic 400 ${s}px Serif, Caladea, serif`,
  mono: (w, s) => `${w} ${s}px "DejaVu Sans Mono", monospace`,
};

// ---------- math / easing ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const E = {
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  outCubic: x => 1 - Math.pow(1 - x, 3),
  outQuint: x => 1 - Math.pow(1 - x, 5),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
function rand(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const beatPulse = (t, from = 2, to = 15) => (t < from || t > to) ? 0 : Math.exp(-((t - from) % 0.5) / 0.09);
const hit = (t, at, d = 0.15) => t < at ? 0 : Math.exp(-(t - at) / d);

// ---------- content ----------
const COURSES = [
  ['Claude 101', 'claude-101'],
  ['AI Capabilities and Limitations', 'ai-capabilities-and-limitations'],
  ['AI Fluency: Framework & Foundations', 'ai-fluency-framework-foundations'],
  ['Introduction to Claude Cowork', 'introduction-to-claude-cowork'],
  ['Claude Code 101', 'claude-code-101'],
  ['Claude Code in Action', 'claude-code-in-action'],
  ['Introduction to Agent Skills', 'introduction-to-agent-skills'],
  ['Introduction to Subagents', 'introduction-to-subagents'],
  ['Claude Platform 101', 'claude-platform-101'],
  ['Building with the Claude API', 'claude-with-the-anthropic-api'],
  ['Introduction to Model Context Protocol (MCP)', 'introduction-to-model-context-protocol'],
  ['MCP: Advanced Topics', 'model-context-protocol-advanced-topics'],
  ['Claude with Amazon Bedrock', 'claude-in-amazon-bedrock'],
  ['Claude on Google Cloud (Vertex AI)', 'claude-with-google-vertex'],
  ['AI Fluency for Builders', 'ai-fluency-for-builders', 'AI FLUENCY FOR', 'Builders'],
  ['AI Fluency for Creative Work', 'ai-fluency-for-creative-work', 'AI FLUENCY FOR', 'Creative Work'],
  ['AI Fluency for Small Businesses', 'ai-fluency-for-small-businesses', 'AI FLUENCY FOR', 'Small Businesses'],
  ['AI Fluency for Students', 'ai-fluency-for-students', 'AI FLUENCY FOR', 'Students'],
  ['AI Fluency for Educators', 'ai-fluency-for-educators', 'AI FLUENCY FOR', 'Educators'],
  ['Teaching AI Fluency', 'teaching-ai-fluency', 'TEACHING', 'AI Fluency'],
];
const SCENES = [
  { start: 4.0, end: 5.5, from: 0, n: 4, tag: 'FOUNDATIONS', title: ['Start', 'here'], sub: 'Learn how Claude thinks.' },
  { start: 5.5, end: 7.0, from: 4, n: 4, tag: 'CLAUDE CODE & AGENTS', title: ['Ship', 'with code'], sub: 'Agents, skills, subagents.' },
  { start: 7.0, end: 8.5, from: 8, n: 4, tag: 'API & MCP', title: ['Build on', 'the API'], sub: 'Wire Claude into anything.' },
  { start: 8.5, end: 9.5, from: 12, n: 2, tag: 'CLOUD', title: ['Run it in', 'the cloud'], sub: 'Bedrock & Vertex AI.' },
  { start: 9.5, end: 12.0, from: 14, n: 6, tag: 'AI FLUENCY TRACKS', title: ['Fluency for', 'everyone'], sub: 'Pick the track that fits you.' },
];
const pad2 = n => String(n).padStart(2, '0');

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function fitSize(text, maxW, size, fontFn) {
  let s = size; ctx.font = fontFn(s);
  while (ctx.measureText(text).width > maxW && s > 10) { s -= 1; ctx.font = fontFn(s); }
  return s;
}
function txt(s, x, y, font, color, align = 'left', alpha = 1, spacing = 0) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = font; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.letterSpacing = spacing + 'px';
  ctx.fillText(s, x, y); ctx.restore();
}
// mask-reveal: text slides up from behind a clip line
function maskText(s, x, y, font, color, p, align = 'left', size = 100, spacing = 0) {
  if (p <= 0) return;
  ctx.save();
  ctx.font = font; ctx.letterSpacing = spacing + 'px';
  const w = ctx.measureText(s).width;
  const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  ctx.beginPath(); ctx.rect(x0 - 40, y - size * 1.05, w + 80, size * 1.32); ctx.clip();
  const dy = (1 - E.outExpo(p)) * size * 1.15;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(s, x, y + dy);
  ctx.restore();
}

// Claude-style spark: tapered rays of uneven length
const RAYS = [1, .74, .9, .68, .97, .8, .7, .93, .76, .88, .72, .85];
function spark(x, y, R, grow, rot, color = C.orange, alpha = 1) {
  if (grow <= 0 || alpha <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha *= alpha;
  ctx.fillStyle = color;
  const n = RAYS.length;
  for (let i = 0; i < n; i++) {
    const g = E.outBack(P(grow, i * 0.035, i * 0.035 + 0.55));
    if (g <= 0) continue;
    const L = R * RAYS[i] * g, a = (i / n) * Math.PI * 2;
    const wb = R * 0.075, wt = R * 0.05;
    ctx.save(); ctx.rotate(a);
    ctx.beginPath();
    ctx.moveTo(0, -wb * 0.5);
    ctx.lineTo(L - wt, -wt); ctx.arc(L - wt, 0, wt, -Math.PI / 2, Math.PI / 2); ctx.lineTo(0, wb * 0.5);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(0, 0, R * 0.14 * E.outBack(clamp(grow * 2)), 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function ribbon(x, y, s, color, p = 1) { // certificate badge icon
  ctx.save(); ctx.translate(x, y); ctx.scale(s * E.outBack(p), s * E.outBack(p));
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2.4; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-7, 6); ctx.lineTo(-11, 22); ctx.lineTo(-4, 18); ctx.lineTo(0, 24); ctx.lineTo(3, 9); ctx.fill();
  ctx.beginPath(); ctx.moveTo(7, 6); ctx.lineTo(11, 22); ctx.lineTo(4, 18); ctx.lineTo(0, 24); ctx.lineTo(-3, 9); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -2, 13, 0, Math.PI * 2); ctx.fillStyle = '#000'; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-5.5, -2); ctx.lineTo(-1.5, 2.5); ctx.lineTo(6, -6); ctx.stroke();
  ctx.restore();
}

// ---------- background layers ----------
const grain = [];
(function makeGrain() {
  const r = rand(11);
  for (let k = 0; k < 6; k++) {
    const g = document.createElement('canvas'); g.width = 480; g.height = 270;
    const gx = g.getContext('2d'); const id = gx.createImageData(480, 270);
    for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
    gx.putImageData(id, 0, 0); grain.push(g);
  }
})();

function background(t) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  // drifting dot grid (perspective-free, subtle), pulses on beat
  const bp = beatPulse(t, 2, 14);
  const sp = 64, ox = (t * 18) % sp, oy = (t * 9) % sp;
  ctx.fillStyle = `rgba(240,238,230,${0.05 + 0.03 * bp})`;
  for (let y = -sp; y < H + sp; y += sp) for (let x = -sp; x < W + sp; x += sp) {
    ctx.fillRect(x + ox - 1, y + oy - 1, 2, 2);
  }
  // deep warm glow (keeps base black)
  const gx = 960 + Math.sin(t * 0.7) * 260, gy = 540 + Math.cos(t * 0.5) * 120;
  const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, 900);
  g.addColorStop(0, `rgba(217,119,87,${0.06 + 0.03 * bp})`); g.addColorStop(1, 'rgba(217,119,87,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function vignetteAndGrain(t, frame) {
  const v = ctx.createRadialGradient(960, 540, 650, 960, 540, 1250);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = 0.022; ctx.globalCompositeOperation = 'screen';
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(grain[frame % grain.length], 0, 0, W, H); ctx.restore();
}

// ---------- transitions ----------
function wipe(t, at, dur = 0.22) {          // orange diagonal bars cover at `at`, uncover after
  const a = P(t, at - dur, at), b = P(t, at, at + dur);
  if (a <= 0 || b >= 1) return;
  const cols = [C.kraft, C.clay, C.orange];
  for (let i = 0; i < 3; i++) {
    const lagIn = clamp(E.inOutCubic(clamp(a * 1.25 - i * 0.12)));
    const lagOut = clamp(E.inOutCubic(clamp(b * 1.25 - i * 0.12)));
    const sk = 420, total = W + sk * 2;
    const x1 = -sk + total * lagOut - sk, x2 = -sk + total * lagIn;
    if (x2 <= x1) continue;
    ctx.fillStyle = cols[i];
    ctx.beginPath(); ctx.moveTo(x1, 0); ctx.lineTo(x2 + sk, 0); ctx.lineTo(x2, H); ctx.lineTo(x1 - sk, H); ctx.closePath(); ctx.fill();
  }
  // black spark stamped into the cover at its peak
  const m = Math.min(P(t, at - 0.12, at), 1 - P(t, at, at + 0.1));
  if (m > 0) spark(960, 540, 140 * E.outBack(m), 1, t * 2, '#000', 1);
}
function slash(t, at) {                      // thin light streak across the frame at a soft cut
  const p = P(t, at - 0.16, at + 0.2); if (p <= 0 || p >= 1) return;
  const e = E.inOutExpo(p), x = lerp(-600, W + 600, e);
  ctx.save(); ctx.translate(x, 540); ctx.rotate(0.32);
  const g = ctx.createLinearGradient(-260, 0, 260, 0);
  g.addColorStop(0, 'rgba(217,119,87,0)'); g.addColorStop(.5, 'rgba(217,119,87,0.9)'); g.addColorStop(1, 'rgba(217,119,87,0)');
  ctx.fillStyle = g; ctx.fillRect(-260, -900, 520, 1800);
  ctx.fillStyle = C.ivory; ctx.globalAlpha = 0.9; ctx.fillRect(-2, -900, 4, 1800);
  ctx.restore();
}
function flash(t, at, strength = 0.55) {
  const h = hit(t, at, 0.14); if (h < 0.01) return;
  const g = ctx.createRadialGradient(960, 540, 0, 960, 540, 1300);
  g.addColorStop(0, `rgba(240,238,230,${h * strength})`); g.addColorStop(.4, `rgba(217,119,87,${h * strength * .6})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// =====================================================================
//  SCENE: INTRO  (0 – 2)
// =====================================================================
const PARTS = (() => { const r = rand(3); return Array.from({ length: 90 }, () => ({ a: r() * Math.PI * 2, d: 500 + r() * 900, s: 0.6 + r() * 0.8, w: 1 + r() * 2.5, c: r() })); })();
function intro(t) {
  if (t > 2.05) return;
  // shockwave rings on the opening hit
  for (let k = 0; k < 3; k++) {
    const p = P(t, 0.02 + k * 0.12, 1.2 + k * 0.12); if (p <= 0 || p >= 1) continue;
    ctx.strokeStyle = k === 1 ? C.kraft : C.orange; ctx.globalAlpha = (1 - p) * 0.8; ctx.lineWidth = 6 * (1 - p) + 0.5;
    ctx.beginPath(); ctx.arc(960, 540, E.outExpo(p) * (700 + k * 200), 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
  }
  // converging particle streaks
  const cp = P(t, 0, 0.95);
  if (cp < 1) for (const q of PARTS) {
    const e = E.inExpo(clamp(cp * q.s * 1.3)), r1 = q.d * (1 - e), r0 = q.d * (1 - clamp(e + 0.08));
    const a = q.a + e * 1.6;
    ctx.strokeStyle = q.c > 0.7 ? C.ivory : q.c > 0.35 ? C.orange : C.kraft;
    ctx.globalAlpha = 0.25 + 0.75 * e; ctx.lineWidth = q.w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(960 + Math.cos(a) * r1, 540 + Math.sin(a) * r1);
    ctx.lineTo(960 + Math.cos(a - 0.08) * r0, 540 + Math.sin(a - 0.08) * r0); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // zoom-through into the drop
  const z = E.inExpo(P(t, 1.7, 2.0));
  ctx.save(); ctx.translate(960, 540); ctx.scale(1 + z * 3.5, 1 + z * 3.5); ctx.translate(-960, -540);
  ctx.globalAlpha = 1 - z;

  // spark: grows at centre, then lifts to make room for the counter
  const lift = E.inOutExpo(P(t, 0.85, 1.35));
  const sy = lerp(540, 300, lift), sR = lerp(170, 78, lift);
  const glow = ctx.createRadialGradient(960, sy, 0, 960, sy, sR * 2.6);
  glow.addColorStop(0, 'rgba(217,119,87,0.35)'); glow.addColorStop(1, 'rgba(217,119,87,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  spark(960, sy, sR, P(t, 0.12, 1.0), -1.4 + E.outQuint(P(t, 0.1, 1.6)) * 1.4 + t * 0.25);

  // counter 00 → 20
  const cp2 = P(t, 0.95, 1.55);
  if (cp2 > 0) {
    const n = Math.round(E.outCubic(cp2) * 20);
    const s = 1 + 0.12 * hit(t, 1.55, 0.12);
    ctx.save(); ctx.translate(960, 700); ctx.scale(s, s);
    maskText(pad2(n), 0, 90, F.display(900, 300), C.ivory, P(t, 0.95, 1.3), 'center', 300, -6);
    ctx.restore();
    maskText('ANTHROPIC ACADEMY', 960, 470, F.mono(500, 26), C.kraft, P(t, 1.05, 1.4), 'center', 30, 12);
    // tick ring around counter
    const tp = P(t, 1.0, 1.6);
    for (let i = 0; i < 20; i++) {
      const on = i < Math.round(E.outCubic(cp2) * 20);
      const a = -Math.PI / 2 + (i / 20) * Math.PI * 2 * E.outExpo(tp);
      ctx.fillStyle = on ? C.orange : 'rgba(240,238,230,0.15)';
      ctx.beginPath(); ctx.arc(960 + Math.cos(a) * 560, 640 + Math.sin(a) * 120, 5, 0, Math.PI * 2); ctx.globalAlpha = (1 - z) * tp; ctx.fill();
    }
    ctx.globalAlpha = 1 - z;
  }
  ctx.restore();
}

// =====================================================================
//  SCENE: TITLE  (2 – 4)
// =====================================================================
function title(t) {
  if (t < 1.98 || t > 4.05) return;
  const lt = t - 2;
  const zoom = 1 + lt * 0.025;
  ctx.save(); ctx.translate(960, 540); ctx.scale(zoom, zoom); ctx.translate(-960, -540);

  // giant background spark, rotating
  spark(1640, 820, 620, P(t, 2.0, 2.7), t * 0.35, C.orange, 0.10);
  spark(260, 210, 240, P(t, 2.1, 2.8), -t * 0.5, C.kraft, 0.07);
  // beat rings
  for (let k = 0; k < 4; k++) {
    const bt = 2 + k * 0.5, p = P(t, bt, bt + 0.9); if (p <= 0 || p >= 1) continue;
    ctx.strokeStyle = C.orange; ctx.globalAlpha = (1 - p) * 0.35; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(960, 470, 200 + E.outCubic(p) * 800, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
  }

  // line 1: "20 FREE" letter-by-letter
  const L1 = [['2', C.orange], ['0', C.orange], [' ', C.ivory], ['F', C.ivory], ['R', C.ivory], ['E', C.ivory], ['E', C.ivory]];
  ctx.font = F.display(900, 260); ctx.letterSpacing = '-8px';
  const widths = L1.map(([ch]) => ctx.measureText(ch).width);
  let x = 960 - widths.reduce((a, b) => a + b, 0) / 2;
  L1.forEach(([ch, col], i) => {
    maskText(ch, x, 400, F.display(900, 260), col, P(t, 2.0 + i * 0.035, 2.45 + i * 0.035), 'left', 260, -8);
    x += widths[i];
  });

  // line 2: serif words
  const words = ['Claude', 'AI', 'Courses'];
  ctx.font = F.serif(130); ctx.letterSpacing = '0px';
  const ww = words.map(w => ctx.measureText(w + ' ').width);
  let x2 = 960 - (ww.reduce((a, b) => a + b, 0) - ctx.measureText(' ').width) / 2;
  words.forEach((w, i) => {
    maskText(w, x2, 560, F.serif(130), i === 0 ? C.orange : C.manilla, P(t, 2.18 + i * 0.07, 2.6 + i * 0.07), 'left', 130);
    x2 += ww[i];
  });
  // underline sweep
  const up = E.outExpo(P(t, 2.45, 2.95));
  ctx.fillStyle = C.orange; ctx.fillRect(960 - 430 * up, 592, 860 * up, 4);

  // pill: WITH CERTIFICATES
  const pp = P(t, 2.5, 3.0);
  if (pp > 0) {
    const pw = 560, ph = 84, px = 960 - pw / 2, py = 640;
    ctx.save();
    ctx.strokeStyle = C.orange; ctx.lineWidth = 3;
    rr(px, py, pw, ph, 42); ctx.setLineDash([2000]); ctx.lineDashOffset = 2000 * (1 - E.outCubic(pp)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = E.outCubic(P(t, 2.65, 3.0));
    ctx.fillStyle = 'rgba(217,119,87,0.12)'; rr(px, py, pw, ph, 42); ctx.fill();
    ctx.restore();
    ribbon(px + 68, py + 40, 1.35, C.orange, P(t, 2.65, 3.0));
    txt('WITH CERTIFICATES', px + 118, py + 53, F.mono(700, 30), C.ivory, 'left', E.outCubic(P(t, 2.7, 3.05)), 6);
  }
  // sub line
  maskText('free · self-paced · from Anthropic', 960, 830, F.mono(400, 26), C.gray, P(t, 2.9, 3.3), 'center', 30, 3);
  ctx.restore();
}

// =====================================================================
//  COURSE SCENES  (4 – 12)
// =====================================================================
function courseScene(t, sc, si) {
  if (t < sc.start - 0.05 || t > sc.end + 0.05) return;
  const lt = t - sc.start, dur = sc.end - sc.start;
  const outP = E.inExpo(P(t, sc.end - 0.2, sc.end));             // exit
  const bp = beatPulse(t, 2, 11.5);

  // ghost index number (parallax)
  ctx.save();
  ctx.font = F.display(900, 560); ctx.letterSpacing = '-20px';
  ctx.strokeStyle = `rgba(217,119,87,${0.16 * (1 - outP)})`; ctx.lineWidth = 2;
  const gx = 90 - lt * 30 - outP * 200;
  ctx.strokeText(pad2(sc.from + 1), gx, 900);
  ctx.restore();

  // left column
  const lx = 120 - outP * 140;
  ctx.save(); ctx.globalAlpha = 1 - outP;
  const rule = E.outExpo(P(lt, 0.0, 0.5));
  ctx.fillStyle = C.orange; ctx.fillRect(lx, 300, 6, 420 * rule);
  const range = `${pad2(sc.from + 1)}—${pad2(sc.from + sc.n)}`;
  maskText(range + '  /  ' + sc.tag, lx + 40, 340, F.mono(700, 24), C.orange, P(lt, 0.02, 0.35), 'left', 28, 4);
  const tsz = 116;
  sc.title.forEach((line, i) => {
    const last = i === sc.title.length - 1;
    maskText(line, lx + 36, 470 + i * 118, F.display(900, tsz), C.ivory, P(lt, 0.05 + i * 0.06, 0.45 + i * 0.06), 'left', tsz, -3);
    if (last) { // orange full stop
      ctx.font = F.display(900, tsz); ctx.letterSpacing = '-3px';
      const w = ctx.measureText(line).width;
      const dp = E.outBack(P(lt, 0.35, 0.6));
      ctx.fillStyle = C.orange; ctx.beginPath(); ctx.arc(lx + 36 + w + 26, 470 + i * 118 - 12, 13 * dp * (1 + 0.25 * bp), 0, Math.PI * 2); ctx.fill();
    }
  });
  maskText(sc.sub, lx + 40, 470 + sc.title.length * 118 + 10, F.serif(44), C.manilla, P(lt, 0.2, 0.6), 'left', 46);
  ctx.restore();

  // right column cards
  const rx = 840, rw = 960;
  const items = Array.from({ length: sc.n }, (_, k) => sc.from + k);
  let layout;
  if (sc.n === 6) {
    const cw = (rw - 24) / 2, ch = 176;
    layout = items.map((ci, k) => ({ ci, x: rx + (k % 2) * (cw + 24), y: 230 + Math.floor(k / 2) * (ch + 22), w: cw, h: ch }));
  } else {
    const ch = sc.n === 2 ? 230 : 148, gap = sc.n === 2 ? 30 : 20;
    const tot = sc.n * ch + (sc.n - 1) * gap, y0 = 540 - tot / 2 + 10;
    layout = items.map((ci, k) => ({ ci, x: rx, y: y0 + k * (ch + gap), w: rw, h: ch }));
  }
  layout.forEach((L, k) => {
    const d = 0.08 + k * (sc.n === 6 ? 0.07 : 0.085);
    const ip = E.outExpo(P(lt, d, d + 0.55));
    const op = E.inExpo(P(t, sc.end - 0.22 + k * 0.012, sc.end - 0.02));
    if (ip <= 0) return;
    const x = L.x + (1 - ip) * 260 - op * 320, a = ip * (1 - op);
    card(L, x, a, lt - d, sc.n, t);
  });
}

function card(L, x, a, cl, n, t) {
  const { ci, y, w, h } = L;
  const [name, slug, pre, main] = COURSES[ci];
  ctx.save(); ctx.globalAlpha = a;
  // body
  rr(x, y, w, h, 18); ctx.fillStyle = C.card; ctx.fill();
  ctx.strokeStyle = 'rgba(217,119,87,0.28)'; ctx.lineWidth = 1.5; ctx.stroke();
  // accent bar grows
  const ab = E.outExpo(clamp(cl / 0.4));
  ctx.save(); rr(x, y, w, h, 18); ctx.clip();
  ctx.fillStyle = C.orange; ctx.fillRect(x, y + h * (1 - ab) / 2, 6, h * ab);
  // shine sweep
  const sp = clamp((cl - 0.25) / 0.5);
  if (sp > 0 && sp < 1) {
    const sx = x - 300 + (w + 600) * E.inOutCubic(sp);
    const g = ctx.createLinearGradient(sx - 160, 0, sx + 160, 0);
    g.addColorStop(0, 'rgba(240,238,230,0)'); g.addColorStop(.5, 'rgba(240,238,230,0.09)'); g.addColorStop(1, 'rgba(240,238,230,0)');
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  }
  ctx.restore();

  const num = pad2(ci + 1);
  const ok = E.outBack(clamp((cl - 0.18) / 0.35));
  if (n === 6) {
    // stacked typographic card: label + big word
    txt(num, x + 34, y + 54, F.mono(700, 26), C.orange);
    txt(pre, x + 34 + 56, y + 53, F.mono(500, 20), C.gray, 'left', 1, 3);
    const s = fitSize(main, w - 130, 56, sz => F.display(800, sz));
    txt(main, x + 32, y + 130, F.display(800, s), C.ivory, 'left', 1, -1);
    ribbon(x + w - 52, y + 48, 1.15, C.orange, ok);
  } else {
    const big = n === 2;
    // number tile
    const nt = big ? 104 : 84;
    rr(x + 30, y + (h - nt) / 2, nt, nt, 14); ctx.strokeStyle = C.orange; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(217,119,87,0.10)'; ctx.fill();
    txt(num, x + 30 + nt / 2, y + h / 2 + (big ? 14 : 11), F.mono(700, big ? 40 : 32), C.orange, 'center');
    const tx = x + 30 + nt + 32;
    const s = fitSize(name, w - (tx - x) - (big ? 250 : 120), big ? 58 : 44, sz => F.sans(650, sz));
    txt(name, tx, y + h / 2 + (big ? 2 : 0), F.sans(650, s), C.ivory, 'left', 1, -0.5);
    txt('anthropic.skilljar.com/' + slug, tx, y + h / 2 + (big ? 50 : 40), F.mono(400, big ? 22 : 19), C.gray, 'left', 0.95);
    ribbon(x + w - 60, y + h / 2 - 4, big ? 1.5 : 1.25, C.orange, ok);
    if (big) { // FREE tag
      rr(x + w - 210, y + h / 2 - 22, 92, 40, 20); ctx.strokeStyle = C.kraft; ctx.lineWidth = 2; ctx.stroke();
      txt('FREE', x + w - 164, y + h / 2 + 7, F.mono(700, 19), C.kraft, 'center', 1, 3);
    }
  }
  ctx.restore();
}

// HUD: course tracker (20 segments) + top-right label
function revealedCount(t) {
  let c = 0;
  for (const sc of SCENES) for (let k = 0; k < sc.n; k++) {
    const d = sc.start + 0.08 + k * (sc.n === 6 ? 0.07 : 0.085) + 0.1;
    if (t >= d) c = sc.from + k + 1;
  }
  return c;
}
function hud(t) {
  const a = E.outCubic(P(t, 4.0, 4.4)) * (1 - E.inExpo(P(t, 11.75, 12.0)));
  if (a > 0) {
    ctx.save(); ctx.globalAlpha = a;
    const c = revealedCount(t);
    const x0 = 124, y0 = 990, sw = 30, g = 8;
    for (let i = 0; i < 20; i++) {
      const on = i < c;
      const pulse = on && i === c - 1 ? 1 + 0.6 * beatPulse(t, 4, 12) : 1;
      ctx.fillStyle = on ? C.orange : 'rgba(240,238,230,0.14)';
      ctx.fillRect(x0 + i * (sw + g), y0 - 3 * pulse, sw, 6 * pulse);
    }
    txt(`COURSE ${pad2(Math.max(c, 1))} / 20`, x0 + 20 * (sw + g) + 26, y0 + 9, F.mono(700, 22), C.ivory, 'left', 1, 4);
    ctx.restore();
  }
  const b = E.outCubic(P(t, 2.4, 2.8)) * (1 - E.inExpo(P(t, 11.75, 12.0)));
  if (b > 0) {
    const blink = 0.5 + 0.5 * Math.cos(t * Math.PI * 4);
    ctx.save(); ctx.globalAlpha = b;
    ctx.fillStyle = C.orange; ctx.globalAlpha = b * (0.4 + 0.6 * blink);
    ctx.beginPath(); ctx.arc(W - 420, 54, 7, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = b;
    txt('FREE · CERTIFIED', W - 60, 62, F.mono(700, 22), C.kraft, 'right', 1, 5);
    ctx.restore();
  }
}

// =====================================================================
//  FINALE  (12 – 15)
// =====================================================================
function finale(t) {
  if (t < 11.98) return;
  const lt = t - 12;
  // grid of all 20 (5 x 4), ripple from centre
  const cols = 5, cw = 334, ch = 132, gx = 18, gy = 18;
  const gw = cols * cw + (cols - 1) * gx, gh = 4 * ch + 3 * gy;
  const recede = E.inOutExpo(P(t, 13.0, 13.6));
  const sc = lerp(1, 0.86, recede), alpha = lerp(1, 0.16, recede);
  ctx.save(); ctx.translate(960, 540); ctx.scale(sc, sc); ctx.translate(-960, -540);
  for (let i = 0; i < 20; i++) {
    const cx = i % cols, cy = Math.floor(i / cols);
    const x = 960 - gw / 2 + cx * (cw + gx), y = 540 - gh / 2 + cy * (ch + gy);
    const dist = Math.hypot(x + cw / 2 - 960, y + ch / 2 - 540) / 1000;
    const p = E.outBack(P(lt, dist * 0.45, dist * 0.45 + 0.45));
    if (p <= 0) continue;
    ctx.save(); ctx.globalAlpha = alpha * clamp(p);
    ctx.translate(x + cw / 2, y + ch / 2); ctx.scale(p, p); ctx.rotate((1 - clamp(p)) * 0.2);
    rr(-cw / 2, -ch / 2, cw, ch, 14); ctx.fillStyle = C.card; ctx.fill();
    ctx.strokeStyle = 'rgba(217,119,87,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();
    txt(pad2(i + 1), -cw / 2 + 22, -ch / 2 + 40, F.mono(700, 22), C.orange);
    ribbon(cw / 2 - 30, -ch / 2 + 30, 0.8, C.orange, 1);
    // wrap title to 2 lines
    const name = COURSES[i][0]; ctx.font = F.sans(650, 25);
    const words = name.split(' '); let l1 = '', l2 = '';
    for (const wd of words) { if (!l2 && ctx.measureText((l1 + ' ' + wd).trim()).width < cw - 44) l1 = (l1 + ' ' + wd).trim(); else l2 = (l2 + ' ' + wd).trim(); }
    const s2 = fitSize(l2, cw - 44, 25, sz => F.sans(650, sz));
    txt(l1, -cw / 2 + 22, 18, F.sans(650, 25), C.ivory);
    if (l2) txt(l2, -cw / 2 + 22, 50, F.sans(650, s2), C.ivory);
    ctx.restore();
  }
  ctx.restore();

  // foreground CTA
  const fp = P(t, 13.15, 13.7);
  if (fp > 0) {
    const veil = ctx.createRadialGradient(960, 520, 0, 960, 520, 900);
    veil.addColorStop(0, `rgba(0,0,0,${0.85 * fp})`); veil.addColorStop(1, `rgba(0,0,0,${0.35 * fp})`);
    ctx.fillStyle = veil; ctx.fillRect(0, 0, W, H);
    const sp = P(t, 13.1, 13.8);
    const ring = P(t, 14.0, 14.9);
    if (ring > 0 && ring < 1) {
      ctx.strokeStyle = C.orange; ctx.globalAlpha = (1 - ring) * 0.7; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(960, 285, 70 + E.outExpo(ring) * 600, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
    }
    spark(960, 285, 82 * (1 + 0.12 * hit(t, 14, 0.15)), sp, t * 0.6);
    // headline
    ctx.font = F.display(900, 150); ctx.letterSpacing = '-5px';
    const w1 = ctx.measureText('Learn ').width, w2 = ctx.measureText('Claude.').width;
    const hx = 960 - (w1 + w2) / 2;
    maskText('Learn', hx, 500, F.display(900, 150), C.ivory, P(t, 13.25, 13.7), 'left', 150, -5);
    maskText('Claude.', hx + w1, 500, F.display(900, 150), C.orange, P(t, 13.32, 13.77), 'left', 150, -5);
    maskText('20 courses. Free. With certificates.', 960, 640, F.serif(60), C.manilla, P(t, 13.45, 13.9), 'center', 62);
    // url pill
    const up = P(t, 13.6, 14.05);
    if (up > 0) {
      const pw = 640, ph = 88, px = 960 - pw / 2, py = 712;
      const e = E.outExpo(up);
      ctx.save();
      rr(960 - pw / 2 * e, py, pw * e, ph, 44); ctx.fillStyle = C.orange; ctx.fill();
      ctx.globalAlpha = clamp((up - 0.3) / 0.5);
      txt('anthropic.skilljar.com', 960 - 22, py + 57, F.mono(700, 34), '#000', 'center', 1, 1);
      // arrow
      const ax = px + pw - 62, ay = py + ph / 2, nud = Math.sin(t * Math.PI * 4) * 4;
      ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(ax - 12 + nud, ay + 12 - nud); ctx.lineTo(ax + 12 + nud, ay - 12 - nud);
      ctx.moveTo(ax - 4 + nud, ay - 12 - nud); ctx.lineTo(ax + 12 + nud, ay - 12 - nud); ctx.lineTo(ax + 12 + nud, ay + 4 - nud); ctx.stroke();
      ctx.restore();
    }
    maskText('SAVE THIS  ·  SHARE IT  ·  START TODAY', 960, 880, F.mono(500, 22), C.gray, P(t, 13.9, 14.3), 'center', 26, 6);
  }
}

// =====================================================================
//  WATERMARK (always on top, static)
// =====================================================================
function watermark() {
  ctx.save();
  ctx.font = F.sans(600, 24); ctx.letterSpacing = '1px'; ctx.fillStyle = 'rgba(240,238,230,0.38)';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left'; ctx.fillText('x.com/nrqa__', 44, 52);
  ctx.textAlign = 'right'; ctx.fillText('x.com/nrqa__', W - 44, H - 48);
  ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(240,238,230,0.30)'; ctx.fillText('x.com/nrqa__', W / 2, H / 2 + 26);
  ctx.restore();
}

// =====================================================================
window.renderFrame = function (t, frame = 0) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  background(t);
  // camera shake on the big hits
  const sh = 14 * hit(t, 2.0, 0.12) + 18 * hit(t, 12.0, 0.12) + 8 * hit(t, 14.0, 0.1) + 3 * hit(t, 0, 0.1);
  ctx.save(); ctx.translate(Math.sin(t * 97) * sh, Math.cos(t * 83) * sh);
  intro(t);
  title(t);
  SCENES.forEach((sc, i) => courseScene(t, sc, i));
  finale(t);
  ctx.restore();
  hud(t);
  for (const at of [5.5, 7.0, 8.5, 9.5]) slash(t, at);
  wipe(t, 4.0); wipe(t, 12.0, 0.25);
  flash(t, 0.0, 0.6); flash(t, 2.0, 0.7); flash(t, 12.0, 0.6); flash(t, 14.0, 0.25);
  // final fade-out of last 0.25 s is left to music; picture holds
  vignetteAndGrain(t, frame);
  watermark();
};
renderFrame(0);
</script>
